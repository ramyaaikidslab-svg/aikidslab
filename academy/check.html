<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<meta name="robots" content="noindex">
<title>Connection Check · AI Kids Lab Academy</title>
<link rel="icon" href="../favicon.ico">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
<style>
  .res { border: 2px solid var(--line, #ddd); border-radius: 12px; padding: 12px 14px; margin-top: 12px; }
  .res.ok { border-color: #1a9e5c; } .res.bad { border-color: #d93a3a; }
  .res pre { white-space: pre-wrap; word-break: break-word; font-size: 13px; margin: 8px 0 0; max-height: 180px; overflow: auto; }
</style>
</head>
<body>
<main class="wrap auth">
  <div class="card" style="width:min(100%,640px)">
    <div class="kicker">For teachers</div>
    <h1>Connection check</h1>
    <p class="muted">Tests the database and sign-in exactly the way the app uses them. It only reads; nothing is saved.</p>
    <p class="small muted mono" id="url" style="word-break:break-all"></p>
    <button class="btn primary big block mt" id="go">Run check</button>
    <div id="out" aria-live="polite"></div>
  </div>
</main>
<script type="module">
  import CFG from './js/config.js';
  import { backend } from './js/core/store.js';
  const $ = s => document.querySelector(s), esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
  $('#url').textContent = backend.kind === 'firebase' ? 'Firebase project: ' + CFG.FIREBASE.projectId : backend.kind === 'sheets' ? CFG.BACKEND_URL : '(no backend set: the app is in device-only mode)';
  function show(title, ok, note, detail) {
    $('#out').insertAdjacentHTML('beforeend', `<div class="res ${ok ? 'ok' : 'bad'}"><b>${ok ? '✓' : '✗'} ${esc(title)}</b><p class="small mt">${esc(note)}</p>${detail ? `<pre>${esc(detail)}</pre>` : ''}</div>`);
  }
  async function firebaseChecks() {
    // 1. Database + rules: a read-only lookup of an email that doesn't exist.
    try {
      const r = await backend.lookup('connection-check@example.com');
      if (r.ok) show('1. Database and security rules', true, 'Works.' + (r.allowed ? ' Access mode: open (anyone can sign up).' : ' Access mode: allowlist.'));
      else show('1. Database and security rules', false, r.message || r.error, JSON.stringify(r));
    } catch (e) { show('1. Database and security rules', false, 'Could not reach Firebase. Check the internet connection, or whether a school network/extension blocks googleapis.com.', String(e)); }
    // 2. Sign-in: try a sign-in that must fail, and look at how it fails.
    try {
      const { auth, au } = await backend.ready();
      await auth.signInWithEmailAndPassword(au, 'connection-check@example.com', 'not-a-real-password-123');
      show('2. Email sign-in', true, 'Works.');
    } catch (e) {
      const c = e.code || '';
      if (/invalid-credential|user-not-found|wrong-password|invalid-login/.test(c)) show('2. Email sign-in', true, 'Works.');
      else if (/operation-not-allowed/.test(c)) show('2. Email sign-in', false, 'Email/Password sign-in is switched off. Firebase console → Authentication → Sign-in method → Email/Password → Enable → Save.', c);
      else if (/configuration-not-found/.test(c)) show('2. Email sign-in', false, 'Authentication is not set up. Firebase console → Authentication → Get started, then enable Email/Password.', c);
      else if (/too-many-requests/.test(c)) show('2. Email sign-in', true, 'Works (Firebase is rate-limiting this browser for a few minutes).', c);
      else show('2. Email sign-in', false, 'Unexpected answer from Firebase sign-in.', c || String(e));
    }
  }
  async function sheetsCheck() {
    try { const r = await backend.lookup('connection-check@example.com'); show('Google Sheets backend', !!r.ok, r.ok ? 'Works.' : 'The script answered with an error.', JSON.stringify(r)); }
    catch (e) { show('Google Sheets backend', false, 'Could not reach the Apps Script web app.', String(e)); }
  }
  $('#go').onclick = async () => {
    $('#out').innerHTML = ''; $('#go').disabled = true;
    if (backend.kind === 'firebase') await firebaseChecks();
    else if (backend.kind === 'sheets') await sheetsCheck();
    else show('No backend', false, 'Neither FIREBASE nor BACKEND_URL is set in js/config.js.');
    $('#go').disabled = false;
  };
</script>
</body>
</html>
