<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#15171C">
<title>Teacher Dashboard · AI Kids Lab Academy</title>
<link rel="icon" href="../favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css?v=2026100801">
<style>
  .tmain { padding-top: 24px; padding-bottom: 48px; }
  .tgrid { display: grid; gap: 18px; grid-template-columns: minmax(0, 1fr); }
  .tgrid > * { min-width: 0; }
  .tbar > * { min-width: 0; }
  .tbar .small.muted { overflow-wrap: anywhere; }
  .tbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
  .tstats { display: flex; flex-wrap: wrap; gap: 10px; }
  .tstat { border: 2px solid var(--ink); border-radius: 12px; padding: 8px 14px; background: #fff; min-width: 110px; }
  .tstat b { display: block; font-size: 1.4rem; font-family: var(--display, inherit); }
  .tbl td.num, .tbl th.num { text-align: right; white-space: nowrap; }
  .tbl td { font-size: .9rem; }
  .tbl th, .tbl td { white-space: nowrap; }
  .allow-list { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .allow-list span { display: inline-flex; align-items: center; gap: 6px; border: 2px solid var(--ink); border-radius: 999px; padding: 3px 4px 3px 12px; background: #fff; font-size: .9rem; word-break: break-all; }
  .allow-list button { border: 0; background: var(--ink); color: #fff; border-radius: 999px; width: 26px; height: 26px; font-weight: 800; cursor: pointer; flex: none; }
  textarea.input { min-height: 90px; resize: vertical; font-family: inherit; }
  .note { border-left: 4px solid var(--gold, #FFC800); padding: 4px 12px; }
</style>
</head>
<body>
<header class="top"><div class="wrap"><a class="brand" href="./"><svg viewBox="0 0 100 100" aria-hidden="true"><rect x="6" y="6" width="88" height="88" rx="14"/><rect x="34" y="34" width="32" height="32" rx="8"/><rect x="44" y="44" width="12" height="12" rx="3"/></svg><b>AI Kids Lab</b><span>Teacher</span></a></div></header>
<main class="wrap tmain" id="main" aria-live="polite"><div class="loading"><span class="spin"></span>Loading…</div></main>
<script type="module">
  import { backend, normEmail, validEmail } from './js/core/store.js';
  const main = document.getElementById('main');
  const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
  const toDate = v => v && v.toDate ? v.toDate() : v ? new Date(v) : null;
  const fmt = v => { const d = toDate(v); return d && !isNaN(d) ? d.toLocaleString('en-IN', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' }) : ''; };
  const hrs = m => (Math.round((Number(m) || 0) / 6) / 10).toFixed(1);
  let fb, students = [], allow = [], mode = 'open', filter = '';

  function csv(name, rows) {
    const q = v => { const s = String(v == null ? '' : v); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
    const blob = new Blob(['﻿' + rows.map(r => r.map(q).join(',')).join('\r\n')], { type: 'text/csv;charset=utf-8' });
    const a = Object.assign(document.createElement('a'), { href: URL.createObjectURL(blob), download: name });
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  }
  const stamp = () => new Date().toISOString().slice(0, 10);

  if (backend.kind !== 'firebase') {
    main.innerHTML = '<div class="card"><h1>Teacher dashboard</h1><p class="mt">This page needs the Firebase backend (set FIREBASE in js/config.js).</p></div>';
  } else start();

  async function start() {
    fb = await backend.ready();
    await fb.au.authStateReady();
    fb.au.currentUser && fb.au.currentUser.providerData.some(p => p.providerId === 'google.com') ? load() : signInScreen();
  }

  function signInScreen(msg = '') {
    main.innerHTML = `<div class="card" style="max-width:560px;margin:0 auto">
      <div class="kicker">For teachers</div><h1>Teacher dashboard</h1>
      <p class="muted mt">See every student's progress, download it as a spreadsheet, and choose who can sign up.</p>
      <button class="btn primary big block mt2" id="g">Sign in with Google</button>
      <div class="err mt" aria-live="polite">${msg}</div>
      <p class="small muted mt">Only Google accounts listed as admins in the Firestore rules can open this page.</p></div>`;
    document.getElementById('g').onclick = async () => {
      try {
        if (globalThis.__AIKL_FB_TEST_ADMIN) await fb.auth.signInWithCredential(fb.au, fb.auth.GoogleAuthProvider.credential(JSON.stringify(globalThis.__AIKL_FB_TEST_ADMIN)));
        else await fb.auth.signInWithPopup(fb.au, new fb.auth.GoogleAuthProvider());
        load();
      } catch (e) {
        const c = e.code || '';
        signInScreen(/operation-not-allowed/.test(c) ? 'Google sign-in is switched off. Firebase console → Authentication → Sign-in method → Add new provider → Google → Enable → Save.'
          : /unauthorized-domain/.test(c) ? 'This website is not in Firebase\'s authorized domains. Firebase console → Authentication → Settings → Authorized domains → Add domain.'
          : /popup-closed|cancelled-popup/.test(c) ? '' : 'Sign-in failed: ' + esc(c || e.message));
      }
    };
  }

  async function load() {
    main.innerHTML = '<div class="loading"><span class="spin"></span>Loading students…</div>';
    const { fs, db, au } = fb;
    try {
      const [st, al, cfg] = await Promise.all([
        fs.getDocs(fs.collection(db, 'students')), fs.getDocs(fs.collection(db, 'allowlist')), fs.getDoc(fs.doc(db, 'config', 'access'))]);
      students = st.docs.map(d => d.data()).sort((a, b) => (toDate(b.lastSeen) || 0) - (toDate(a.lastSeen) || 0));
      allow = al.docs.map(d => d.id).sort();
      mode = cfg.exists() && cfg.data().mode === 'allowlist' ? 'allowlist' : 'open';
      render();
    } catch (e) {
      if (/permission-denied/.test(e.code || '')) {
        const em = au.currentUser ? au.currentUser.email : '';
        await fb.auth.signOut(au);
        signInScreen(`<b>${esc(em)}</b> is not an admin. Add this email to the ADMINS line in the Firestore rules (Firebase console → Firestore → Rules), click Publish, then sign in again.`);
      } else main.innerHTML = `<div class="card"><h2>Could not load</h2><p class="mt">${esc(e.code || e.message)}</p><button class="btn mt" onclick="location.reload()">Try again</button></div>`;
    }
  }

  function render() {
    const me = fb.au.currentUser.email;
    const active7 = students.filter(s => toDate(s.lastSeen) > Date.now() - 7 * 864e5).length;
    main.innerHTML = `<div class="tgrid">
      <div class="tbar"><div><div class="kicker">Teacher dashboard</div><h1>Students</h1></div>
        <div class="row"><span class="small muted">${esc(me)}</span><button class="btn sm" id="out">Sign out</button></div></div>
      <div class="tstats">
        <div class="tstat"><b>${students.length}</b><span class="small">students</span></div>
        <div class="tstat"><b>${active7}</b><span class="small">active this week</span></div>
        <div class="tstat"><b>${students.reduce((a, s) => a + (s.certificates || 0), 0)}</b><span class="small">certificates</span></div>
        <div class="tstat"><b>${hrs(students.reduce((a, s) => a + (s.minutesLearning || 0), 0))}</b><span class="small">hours learning</span></div>
      </div>

      <div class="card">
        <div class="tbar"><h2>Progress</h2>
          <div class="row"><input class="input" id="q" placeholder="Search name, email, school…" value="${esc(filter)}" style="max-width:260px">
          <button class="btn sm" id="csv">Download CSV</button><button class="btn sm" id="logs">Sign-in log CSV</button></div></div>
        <div class="tblwrap mt"><table class="tbl"><thead><tr><th>Name</th><th>Email</th><th>School</th><th>Class</th>
          <th class="num">Topics done</th><th class="num">Certificates</th><th class="num">XP</th><th class="num">Hours</th><th class="num">Open mistakes</th><th class="num">Python solved</th><th>Last seen</th></tr></thead>
          <tbody id="rows"></tbody></table></div>
        <p class="small muted mt">Topics done is out of 39. Progress updates while students work (about once a minute).</p>
      </div>

      <div class="card">
        <h2>Who can sign up</h2>
        <div class="seg mt" role="group" aria-label="Access mode">
          <button data-mode="open" aria-pressed="${mode === 'open'}">Anyone with the link</button>
          <button data-mode="allowlist" aria-pressed="${mode === 'allowlist'}">Only emails on the list</button>
        </div>
        <p class="small muted mt">${mode === 'allowlist' ? 'Only the emails below can sign up or sign in. Removing an email blocks that student at their next save or sign-in.' : 'Anyone with the link can create an account. The list below is used only when you switch to “Only emails on the list”.'}</p>
        <div class="field mt"><label for="add">Add emails (one per line, or separated by commas)</label>
          <textarea class="input" id="add" placeholder="student1@school.edu.in&#10;student2@gmail.com"></textarea></div>
        <div class="row mt"><button class="btn primary sm" id="addb">Add to list</button><span class="small" id="addmsg" aria-live="polite"></span></div>
        <h3 class="mt2">On the list (${allow.length})</h3>
        <div class="allow-list">${allow.map(e => `<span>${esc(e)}<button data-rm="${esc(e)}" aria-label="Remove ${esc(e)}">×</button></span>`).join('') || '<p class="small muted">No emails yet.</p>'}</div>
      </div>

      <div class="card">
        <h2>Forgotten PINs</h2>
        <p class="note mt">Open the <a href="https://console.firebase.google.com/project/${esc(fb.au.app.options.projectId)}/authentication/users" target="_blank" rel="noopener">Firebase console → Authentication → Users</a>, find the student's email, click <b>⋮ → Delete account</b>. Their progress is kept. Next time they sign in, the PIN they type becomes their new PIN.</p>
      </div>
    </div>`;
    rows();
    main.querySelector('#q').oninput = e => { filter = e.target.value; rows(); };
    main.querySelector('#out').onclick = async () => { await fb.auth.signOut(fb.au); signInScreen(); };
    main.querySelector('#csv').onclick = () => csv(`academy-students-${stamp()}.csv`, [
      ['Name', 'Email', 'School', 'Class', 'Topics done', 'Certificates', 'XP', 'Minutes learning', 'Open mistakes', 'Python solved', 'Last page', 'Joined', 'Last seen'],
      ...students.map(s => [s.name, s.email, s.school, s.section, s.topicsDone, s.certificates, s.xp, s.minutesLearning, s.openMistakes, s.pythonSolved, s.lastPage, fmt(s.created), fmt(s.lastSeen)])]);
    main.querySelector('#logs').onclick = async e => {
      const b = e.target; b.disabled = true;
      try {
        const { fs, db } = fb, snap = await fs.getDocs(fs.query(fs.collection(db, 'logins'), fs.orderBy('at', 'desc'), fs.limit(2000)));
        csv(`academy-signins-${stamp()}.csv`, [['Time', 'Email', 'Name', 'Event'], ...snap.docs.map(d => { const v = d.data(); return [fmt(v.at), v.email, v.name, v.event]; })]);
      } catch (err) { alert('Could not load the sign-in log: ' + (err.code || err.message)); }
      b.disabled = false;
    };
    main.querySelectorAll('[data-mode]').forEach(b => b.onclick = async () => {
      if (b.dataset.mode === mode) return;
      if (b.dataset.mode === 'allowlist' && !allow.length && !confirm('The list is empty, so nobody would be able to sign in. Switch anyway?')) return;
      try { await fb.fs.setDoc(fb.fs.doc(fb.db, 'config', 'access'), { mode: b.dataset.mode }); mode = b.dataset.mode; render(); }
      catch (err) { alert('Could not change the setting: ' + (err.code || err.message)); }
    });
    main.querySelector('#addb').onclick = async () => {
      const list = [...new Set(main.querySelector('#add').value.split(/[\s,;]+/).map(normEmail).filter(Boolean))];
      const bad = list.filter(e => !validEmail(e)), good = list.filter(e => validEmail(e) && !allow.includes(e));
      const msg = main.querySelector('#addmsg');
      if (bad.length) { msg.textContent = 'Not valid: ' + bad.join(', '); return; }
      if (!good.length) { msg.textContent = 'Nothing new to add.'; return; }
      try {
        for (let i = 0; i < good.length; i += 400) {
          const batch = fb.fs.writeBatch(fb.db);
          good.slice(i, i + 400).forEach(e => batch.set(fb.fs.doc(fb.db, 'allowlist', e), { addedAt: fb.fs.serverTimestamp() }));
          await batch.commit();
        }
        allow = [...allow, ...good].sort(); render();
        main.querySelector('#addmsg').textContent = `Added ${good.length}.`;
      } catch (err) { msg.textContent = 'Could not add: ' + (err.code || err.message); }
    };
    main.querySelectorAll('[data-rm]').forEach(b => b.onclick = async () => {
      const e = b.dataset.rm;
      if (!confirm(`Remove ${e} from the list?`)) return;
      try { await fb.fs.deleteDoc(fb.fs.doc(fb.db, 'allowlist', e)); allow = allow.filter(x => x !== e); render(); }
      catch (err) { alert('Could not remove: ' + (err.code || err.message)); }
    });
  }

  function rows() {
    const f = filter.trim().toLowerCase();
    const list = students.filter(s => !f || [s.name, s.email, s.school, s.section].some(v => String(v || '').toLowerCase().includes(f)));
    main.querySelector('#rows').innerHTML = list.map(s => `<tr><td>${esc(s.name)}</td><td>${esc(s.email)}</td><td>${esc(s.school)}</td><td>${esc(s.section)}</td>
      <td class="num">${s.topicsDone || 0}</td><td class="num">${s.certificates || 0}</td><td class="num">${s.xp || 0}</td><td class="num">${hrs(s.minutesLearning)}</td>
      <td class="num">${s.openMistakes || 0}</td><td class="num">${s.pythonSolved || 0}</td><td>${esc(fmt(s.lastSeen))}</td></tr>`).join('')
      || `<tr><td colspan="11" class="muted">${students.length ? 'No students match.' : 'No students yet. They appear here after they sign up.'}</td></tr>`;
  }
</script>
</body>
</html>
