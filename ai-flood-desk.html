<style>
  /* Flood Desk — a cinematic, story-led lesson. Night control room in the
     AI Kids Lab ink and gold, brand typefaces, and an icon set drawn on the
     logo's nested-rounded-square grid. Self-contained: no site.css. */
  :root{
    color-scheme: only dark;
    --ink:#0B0D11; --ink-2:#11141A; --ink-3:#181C23; --ink-4:#222731;
    --line:rgba(243,239,230,.08); --line-2:rgba(243,239,230,.15); --line-3:rgba(243,239,230,.28);
    --paper:#F3EFE6; --dim:#B4B7BE; --faint:#7C818C;
    --gold:#FFC800; --gold-2:#DFA426; --gold-wash:rgba(255,200,0,.09); --gold-line:rgba(255,200,0,.38);
    --alert:#FF6B5B; --alert-wash:rgba(255,107,91,.11);
    --ok:#5BD6A8; --ok-wash:rgba(91,214,168,.11);
    --water:#5AA9E6; --water-deep:#1E3A52;
    --serif:'Newsreader',Georgia,'Times New Roman',serif;
    --sans:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
    --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
    --r:4px; --ease:cubic-bezier(.22,.61,.36,1);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{-webkit-text-size-adjust:100%;}
  body{
    font-family:var(--sans); color:var(--paper); background:var(--ink); line-height:1.55; font-size:16px;
    -webkit-font-smoothing:antialiased; min-height:100vh;
    background-image:radial-gradient(120% 70% at 70% -10%, rgba(255,200,0,.06), transparent 60%);
  }
  button, input, textarea{font:inherit; color:inherit;}
  button{cursor:pointer;}
  :focus-visible{outline:2px solid var(--gold); outline-offset:3px;}
  ::selection{background:var(--gold); color:var(--ink);}
  #rain{position:fixed; inset:0; z-index:0; pointer-events:none; opacity:.55;}

  .ic{width:20px; height:20px; flex-shrink:0; fill:none; stroke:currentColor; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round; vertical-align:middle;}
  .ic.sm{width:15px; height:15px;} .ic.lg{width:30px; height:30px;} .ic.xl{width:46px; height:46px; stroke-width:1.3;}
  .mono{font-family:var(--mono);}
  .gold{color:var(--gold);} .dim{color:var(--dim);} .faint{color:var(--faint);}
  .okc{color:var(--ok);} .alc{color:var(--alert);}

  /* ---------- TOP BAR ---------- */
  .top{position:sticky; top:env(safe-area-inset-top,0px); z-index:30; background:rgba(11,13,17,.92); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); border-bottom:1px solid var(--line-2);}
  .top-in{max-width:1240px; margin:0 auto; padding:0 16px; height:60px; display:flex; align-items:center; gap:18px;}
  .brand{display:flex; align-items:center; gap:10px; text-decoration:none; color:var(--paper); flex-shrink:0;}
  .brand .mark{width:24px; height:24px;}
  .brand .mark rect:first-child{fill:none; stroke:var(--gold); stroke-width:10;}
  .brand .mark rect:nth-child(2){fill:var(--gold);}
  .brand .mark rect:last-child{fill:var(--ink);}
  .brand b{font-family:var(--mono); font-weight:600; font-size:.78rem; letter-spacing:.16em;}
  .brand span{font-family:var(--mono); font-size:.68rem; letter-spacing:.14em; color:var(--faint);}
  .track{display:flex; gap:4px; margin:0 auto; list-style:none;}
  .trk{display:flex; align-items:center; gap:8px; background:none; border:0; border-bottom:2px solid transparent; padding:8px 10px; color:var(--faint); font-family:var(--mono); font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; cursor:default;}
  .trk.done{color:var(--dim); cursor:pointer;} .trk.done:hover{color:var(--paper);}
  .trk.done .ic{color:var(--gold);}
  .trk.now{color:var(--paper); border-bottom-color:var(--gold);}
  .trk.now .ic{color:var(--gold);}
  .top-r{display:flex; align-items:center; gap:10px; margin-left:auto;}
  .clock{font-family:var(--mono); font-weight:500; font-size:1.15rem; color:var(--gold); letter-spacing:.04em; font-variant-numeric:tabular-nums; display:flex; align-items:baseline; gap:6px;}
  .clock small{font-size:.6rem; color:var(--faint); letter-spacing:.14em;}
  .clock.tick{animation:tick .6s var(--ease);}
  @keyframes tick{0%{opacity:.2; transform:translateY(-4px);} 100%{opacity:1; transform:none;}}
  .tbtn{display:inline-flex; align-items:center; gap:6px; height:36px; padding:0 10px; background:none; border:1px solid var(--line-2); border-radius:var(--r); color:var(--dim); font-family:var(--mono); font-size:.72rem;}
  .tbtn:hover{border-color:var(--gold-line); color:var(--paper);}
  .tbtn .n{color:var(--gold); font-weight:600;}
  @media (max-width:1020px){ .track .lbl{display:none;} .track{margin:0 0 0 auto;} .top-r{margin-left:6px;} }
  @media (max-width:640px){ .brand span{display:none;} .track{display:none;} .top-in{gap:10px;} .tbtn .t{display:none;} }

  /* ---------- LAYOUT ---------- */
  main{position:relative; z-index:1;}
  .wrap{max-width:1240px; margin:0 auto; padding:0 16px;}
  .grid{display:grid; grid-template-columns:minmax(0,5fr) minmax(0,7fr); gap:36px; padding-block:40px 80px; align-items:start;}
  @media (max-width:920px){ .grid{grid-template-columns:minmax(0,1fr); gap:24px; padding-block:24px 60px;} }
  .brief{position:sticky; top:96px;}
  @media (max-width:920px){ .brief{position:static;} }
  .kick{display:flex; align-items:center; gap:10px; font-family:var(--mono); font-size:.7rem; letter-spacing:.18em; text-transform:uppercase; color:var(--gold);}
  .brief h2{font-family:var(--serif); font-weight:400; font-size:clamp(2rem,3.6vw,2.9rem); line-height:1.06; letter-spacing:-.015em; margin-top:14px; text-wrap:balance;}
  .story{margin-top:16px; display:grid; gap:12px;}
  .story p{font-family:var(--serif); font-size:1.14rem; line-height:1.6; color:var(--dim); max-width:46ch; font-weight:300;}
  .story p b{color:var(--paper); font-weight:500;}
  .obj{list-style:none; margin-top:26px; border-top:1px solid var(--line-2);}
  .obj li{display:flex; gap:12px; align-items:flex-start; padding:12px 0; border-bottom:1px solid var(--line); color:var(--faint); font-size:.93rem;}
  .obj li .st{width:20px; height:20px; border:1px solid var(--line-3); border-radius:6px; flex-shrink:0; display:grid; place-items:center; margin-top:1px;}
  .obj li.now{color:var(--paper);}
  .obj li.now .st{border-color:var(--gold); box-shadow:0 0 0 3px var(--gold-wash);}
  .obj li.now .st::after{content:""; width:6px; height:6px; border-radius:2px; background:var(--gold);}
  .obj li.done{color:var(--dim);}
  .obj li.done .st{background:var(--gold); border-color:var(--gold); color:var(--ink);}
  .obj li .st .ic{width:13px; height:13px; stroke-width:2.4;}
  @media (max-width:920px){ .obj{display:none;} }

  /* ---------- CONSOLE ---------- */
  .console{background:var(--ink-2); border:1px solid var(--line-2); border-radius:8px; box-shadow:0 30px 80px -40px rgba(0,0,0,.8); overflow:hidden; scroll-margin-top:76px;}
  .chead{display:flex; align-items:center; gap:10px; padding:12px 18px; border-bottom:1px solid var(--line-2); background:var(--ink-3); font-family:var(--mono); font-size:.74rem; letter-spacing:.1em;}
  .chead .ic{color:var(--gold);}
  .chead .ver{color:var(--faint);}
  .pill{margin-left:auto; font-family:var(--mono); font-size:.64rem; letter-spacing:.14em; text-transform:uppercase; padding:4px 9px; border:1px solid; border-radius:20px; white-space:nowrap;}
  .pill.off{color:var(--alert); border-color:rgba(255,107,91,.45); background:var(--alert-wash);}
  .pill.busy{color:var(--gold); border-color:var(--gold-line); background:var(--gold-wash);}
  .pill.on{color:var(--ok); border-color:rgba(91,214,168,.45); background:var(--ok-wash);}
  .cbody{padding:22px 20px 26px;}
  @media (max-width:520px){ .cbody{padding:18px 14px 22px;} .chead{padding:11px 14px;} .chead .ver{display:none;} }
  .fade{animation:fadeUp .45s var(--ease);}
  @keyframes fadeUp{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:none;}}
  .step{font-family:var(--mono); font-size:.68rem; letter-spacing:.16em; text-transform:uppercase; color:var(--faint);}
  .cbody h3{font-family:var(--serif); font-weight:400; font-size:1.55rem; line-height:1.2; margin-top:6px; text-wrap:balance;}
  .lead{color:var(--dim); margin-top:8px; max-width:62ch;}
  .lead b{color:var(--paper); font-weight:500;}
  .row{display:flex; flex-wrap:wrap; gap:10px; align-items:center;}
  .mt{margin-top:16px;} .mt2{margin-top:24px;} .mt3{margin-top:34px;}

  .btn{display:inline-flex; align-items:center; justify-content:center; gap:10px; background:var(--gold); color:#16120A; border:1px solid var(--gold); border-radius:2px; padding:12px 18px; font-family:var(--mono); font-weight:600; font-size:.76rem; letter-spacing:.12em; text-transform:uppercase; transition:background .2s, color .2s, opacity .2s; touch-action:manipulation;}
  .btn:hover:not(:disabled){background:#FFD633;}
  .btn:disabled{opacity:.32; cursor:not-allowed;}
  .btn.ghost{background:transparent; color:var(--paper); border-color:var(--line-3);}
  .btn.ghost:hover:not(:disabled){border-color:var(--gold); color:var(--gold); background:transparent;}
  .btn .ic{width:16px; height:16px; stroke-width:2;}

  .callout{border:1px solid var(--gold-line); background:var(--gold-wash); border-radius:var(--r); padding:14px 16px; display:flex; gap:12px; align-items:flex-start;}
  .callout .ic{color:var(--gold); margin-top:2px;}
  .callout.bad{border-color:rgba(255,107,91,.45); background:var(--alert-wash);} .callout.bad .ic{color:var(--alert);}
  .callout.good{border-color:rgba(91,214,168,.45); background:var(--ok-wash);} .callout.good .ic{color:var(--ok);}
  .callout p{color:var(--dim); font-size:.95rem;} .callout p b{color:var(--paper); font-weight:500;}

  .stats{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); border:1px solid var(--line-2); border-radius:var(--r); overflow:hidden;}
  .stat{padding:12px 14px; border-right:1px solid var(--line);}
  .stat:last-child{border-right:0;}
  .stat .k{font-family:var(--mono); font-size:.62rem; letter-spacing:.14em; text-transform:uppercase; color:var(--faint);}
  .stat .v{font-family:var(--mono); font-size:1.5rem; font-weight:500; font-variant-numeric:tabular-nums; margin-top:2px;}
  .stat .v small{font-size:.8rem; color:var(--faint);}
  @media (max-width:420px){ .stat{padding:10px;} .stat .v{font-size:1.2rem;} }

  /* Charts */
  .chart{width:100%; height:auto; display:block; touch-action:none; user-select:none; -webkit-user-select:none;}
  .chart text{font-family:var(--mono); font-size:11px; fill:var(--faint);}
  .chart .ax{stroke:var(--line-3); stroke-width:1;}
  .chart .gr{stroke:var(--line); stroke-width:1;}
  .chart .handle{cursor:grab; fill:var(--gold); stroke:var(--ink); stroke-width:3;}
  .chart .handle:active{cursor:grabbing;}
  .chart .hit{fill:transparent; cursor:grab;}
  .chart-wrap{border:1px solid var(--line-2); border-radius:var(--r); background:var(--ink); padding:6px; margin-top:16px;}
  .legend{display:flex; flex-wrap:wrap; gap:16px; font-family:var(--mono); font-size:.68rem; letter-spacing:.08em; color:var(--faint); margin-top:10px; text-transform:uppercase;}
  .legend i{display:inline-block; width:10px; height:10px; border-radius:50%; vertical-align:-1px; margin-right:6px;}
  .legend i.f{background:var(--gold);} .legend i.d{border:2px solid var(--paper);} .legend i.t{background:var(--water); border-radius:2px; transform:rotate(45deg);}
  input[type=range]{width:100%; accent-color:var(--gold);}

  /* Records table */
  .tbl-wrap{border:1px solid var(--line-2); border-radius:var(--r); max-height:320px; overflow:auto; margin-top:16px;}
  table.rec{width:100%; border-collapse:collapse; font-family:var(--mono); font-size:.8rem; font-variant-numeric:tabular-nums;}
  table.rec th{position:sticky; top:0; background:var(--ink-3); z-index:1; padding:0; text-align:left; border-bottom:1px solid var(--line-2);}
  table.rec th button{width:100%; text-align:left; background:none; border:0; padding:10px 12px; font-family:var(--mono); font-size:.66rem; letter-spacing:.12em; text-transform:uppercase; color:var(--dim); display:flex; flex-direction:column; gap:4px; transition:background .2s, color .2s;}
  table.rec th button:hover{background:var(--ink-4); color:var(--paper);}
  table.rec th button .tg{font-size:.6rem; color:var(--faint); min-height:1.1em;}
  table.rec th.is-label button{background:var(--gold); color:var(--ink);} table.rec th.is-label .tg{color:var(--ink);}
  table.rec th.is-feat button{background:rgba(90,169,230,.18); color:var(--paper);} table.rec th.is-feat .tg{color:var(--water);}
  table.rec th.is-wrong button{background:var(--alert-wash); color:var(--alert);}
  table.rec td{padding:8px 12px; border-bottom:1px solid var(--line); color:var(--dim);}
  table.rec td.y{color:var(--gold);}

  /* Vision */
  .cam{position:relative; border:1px solid var(--line-2); border-radius:var(--r); overflow:hidden; background:#000;}
  .cam canvas{display:block; width:100%; height:auto; cursor:crosshair; touch-action:none;}
  .cam .tag{position:absolute; width:22px; height:22px; border:2px solid var(--gold); border-radius:4px; transform:translate(-50%,-50%); pointer-events:none; box-shadow:0 0 0 2px rgba(0,0,0,.5);}
  .cam .tag.ok{border-color:var(--ok);}
  .loupe-row{display:grid; grid-template-columns:minmax(0,1fr) 160px; gap:16px; margin-top:16px; align-items:start;}
  @media (max-width:560px){ .loupe-row{grid-template-columns:minmax(0,1fr) 120px; gap:10px;} }
  .loupe{border:1px solid var(--line-2); border-radius:var(--r); background:var(--ink); padding:8px;}
  .loupe canvas{width:100%; height:auto; display:block; image-rendering:pixelated; border-radius:2px;}
  .rgb{display:grid; gap:4px; margin-top:8px; font-family:var(--mono); font-size:.72rem; font-variant-numeric:tabular-nums;}
  .rgb div{display:grid; grid-template-columns:14px 1fr 30px; gap:6px; align-items:center;}
  .rgb .bar{height:6px; background:var(--ink-4); border-radius:3px; overflow:hidden;}
  .rgb .bar i{display:block; height:100%;}
  .finds{display:flex; flex-wrap:wrap; gap:8px; margin-top:12px;}
  .find{display:inline-flex; align-items:center; gap:8px; font-family:var(--mono); font-size:.72rem; letter-spacing:.06em; border:1px solid var(--line-2); border-radius:20px; padding:5px 12px; color:var(--faint);}
  .find.got{border-color:rgba(91,214,168,.5); color:var(--ok);}
  .find .sw{width:12px; height:12px; border-radius:3px; border:1px solid var(--line-3);}

  .shots{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:10px; margin-top:16px;}
  @media (max-width:640px){ .shots{grid-template-columns:repeat(2,minmax(0,1fr));} }
  .shot{border:1px solid var(--line-2); border-radius:var(--r); background:var(--ink); overflow:hidden; transition:border-color .2s, box-shadow .2s;}
  .shot canvas{display:block; width:100%; height:auto;}
  .shot .lb{display:grid; grid-template-columns:1fr 1fr; border-top:1px solid var(--line-2);}
  .shot .lb button{background:none; border:0; padding:8px 4px; font-family:var(--mono); font-size:.6rem; letter-spacing:.12em; color:var(--faint); text-transform:uppercase;}
  .shot .lb button + button{border-left:1px solid var(--line-2);}
  .shot .lb button[aria-pressed="true"]{color:var(--ink); background:var(--paper);}
  .shot .lb button.fl[aria-pressed="true"]{background:var(--gold);}
  .shot.wrong{border-color:var(--alert); box-shadow:0 0 0 2px var(--alert-wash);}
  .shot.wrong{animation:shake .4s;}
  @keyframes shake{25%{transform:translateX(-5px);} 75%{transform:translateX(5px);}}

  .results{display:grid; gap:8px; margin-top:16px;}
  .res{display:grid; grid-template-columns:120px minmax(0,1fr) auto; gap:14px; align-items:center; border:1px solid var(--line-2); border-radius:var(--r); padding:8px; background:var(--ink);}
  .res canvas{width:100%; height:auto; display:block; border-radius:2px;}
  .res .why{font-size:.84rem; color:var(--dim);}
  .res .why b{color:var(--paper); font-weight:500;}
  .res .nn{display:inline-flex; align-items:center; gap:8px; margin-top:6px; font-family:var(--mono); font-size:.66rem; color:var(--faint); letter-spacing:.06em;}
  .res .nn canvas{width:54px; border:1px solid var(--line-2);}
  .verdict{font-family:var(--mono); font-size:.66rem; letter-spacing:.12em; text-transform:uppercase; padding:5px 9px; border-radius:20px; border:1px solid; white-space:nowrap; text-align:center;}
  .verdict.ok{color:var(--ok); border-color:rgba(91,214,168,.5);} .verdict.no{color:var(--alert); border-color:rgba(255,107,91,.5);}
  .tagp{display:inline-block; font-family:var(--mono); font-size:.62rem; letter-spacing:.12em; text-transform:uppercase; padding:2px 7px; border-radius:2px; margin-right:6px;}
  .tagp.f{background:var(--gold); color:var(--ink);} .tagp.c{background:var(--ink-4); color:var(--paper);}
  .tagp.u{background:var(--alert); color:var(--ink);} .tagp.n{background:var(--ink-4); color:var(--dim);}
  @media (max-width:560px){ .res{grid-template-columns:84px minmax(0,1fr); } .res .verdict{grid-column:1 / -1; justify-self:start;} }

  /* Language */
  .msg{border:1px solid var(--line-2); border-radius:var(--r); background:var(--ink); padding:12px 14px;}
  .msg .from{font-family:var(--mono); font-size:.64rem; letter-spacing:.12em; color:var(--faint); text-transform:uppercase; display:flex; gap:8px; align-items:center;}
  .msg .tx{font-size:1rem; margin-top:4px;}
  .msg .gl{font-family:var(--serif); font-style:italic; font-size:.92rem; color:var(--faint); margin-top:2px;}
  .toks{display:flex; flex-wrap:wrap; gap:6px; margin-top:12px;}
  .tok{font-family:var(--mono); font-size:.78rem; padding:4px 8px; border:1px solid var(--line-3); border-radius:3px; background:var(--ink-3); display:inline-flex; gap:6px; align-items:baseline;}
  .tok sub{font-size:.6rem; color:var(--faint);}
  .tok.in{animation:tokIn .35s var(--ease) both;}
  @keyframes tokIn{from{opacity:0; transform:translateY(-6px) scale(.9);} to{opacity:1; transform:none;}}
  .tok.u{border-color:rgba(255,107,91,.6); color:#FFB3A9;} .tok.n{border-color:rgba(91,214,168,.55); color:#A9EBD2;}
  .bank{display:flex; flex-wrap:wrap; gap:8px; margin-top:14px;}
  .chip{font-family:var(--mono); font-size:.8rem; padding:7px 12px; border:1px solid var(--line-3); border-radius:20px; background:none; color:var(--dim); transition:all .15s;}
  .chip:hover{border-color:var(--gold-line); color:var(--paper);}
  .chip[aria-pressed="true"]{background:var(--gold); color:var(--ink); border-color:var(--gold);}
  .mlist{display:grid; gap:8px; margin-top:16px;}
  .mrow{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:12px; align-items:center; border:1px solid var(--line-2); border-radius:var(--r); padding:10px 12px; background:var(--ink);}
  .mrow .tx{font-size:.94rem;}
  .mrow .gl{font-family:var(--serif); font-style:italic; font-size:.86rem; color:var(--faint);}
  .mrow .ex{font-family:var(--mono); font-size:.68rem; color:var(--faint); margin-top:6px; letter-spacing:.02em;}
  .mrow .ex b{color:var(--paper); font-weight:500;}
  .seg{display:inline-grid; grid-template-columns:1fr 1fr; border:1px solid var(--line-3); border-radius:3px; overflow:hidden;}
  .seg button{background:none; border:0; padding:7px 10px; font-family:var(--mono); font-size:.62rem; letter-spacing:.12em; text-transform:uppercase; color:var(--faint);}
  .seg button + button{border-left:1px solid var(--line-3);}
  .seg button[aria-pressed="true"].u{background:var(--alert); color:var(--ink);}
  .seg button[aria-pressed="true"].n{background:var(--paper); color:var(--ink);}
  @media (max-width:520px){ .mrow{grid-template-columns:minmax(0,1fr);} }
  .wbars{display:grid; grid-template-columns:1fr 1fr; gap:18px; margin-top:16px;}
  @media (max-width:520px){ .wbars{grid-template-columns:1fr;} }
  .wbar{display:grid; grid-template-columns:90px 1fr; gap:8px; align-items:center; font-family:var(--mono); font-size:.74rem; margin-top:6px;}
  .wbar .b{height:8px; border-radius:2px;}
  .field{width:100%; background:var(--ink); border:1px solid var(--line-3); border-radius:var(--r); padding:12px 14px; font-size:1rem; color:var(--paper);}
  .field:focus{border-color:var(--gold); outline:none;}

  /* Map */
  .map-wrap{border:1px solid var(--line-2); border-radius:var(--r); background:#0A1016; overflow:hidden; margin-top:16px;}
  .map{display:block; width:100%; height:auto;}
  .map text{font-family:var(--mono);}
  .zones{display:grid; gap:8px; margin-top:16px;}
  .zone{display:grid; grid-template-columns:minmax(0,1.3fr) repeat(3,minmax(0,1fr)) 110px; gap:10px; align-items:center; border:1px solid var(--line-2); border-radius:var(--r); padding:12px; background:var(--ink); transition:border-color .2s, background .2s;}
  .zone.sel{border-color:var(--gold); background:var(--gold-wash);}
  .zone .zn{font-family:var(--serif); font-size:1.1rem; line-height:1.15;}
  .zone .zn small{display:block; font-family:var(--mono); font-size:.6rem; letter-spacing:.12em; color:var(--faint); text-transform:uppercase; margin-top:3px;}
  .zone .rd{font-family:var(--mono); font-size:.72rem; color:var(--dim); display:flex; gap:6px; align-items:center;}
  .zone .rd .ic{width:16px; height:16px; color:var(--faint);}
  .zone .rd b{font-weight:500; color:var(--paper);}
  .zone .rd.hi b{color:var(--alert);} .zone .rd.none b{color:var(--faint); font-style:italic;}
  .zone .btn{padding:9px 10px; font-size:.64rem;}
  .zone .out{grid-column:1 / -1; font-size:.86rem; color:var(--dim); border-top:1px solid var(--line); padding-top:10px; display:none;}
  .zone.reveal .out{display:block;}
  @media (max-width:720px){ .zone{grid-template-columns:repeat(3,minmax(0,1fr));} .zone .zn{grid-column:1 / -1;} .zone .btn{grid-column:1 / -1;} }
  .boats{display:flex; gap:6px;}
  .boats .ic{color:var(--gold);} .boats .ic.used{color:var(--line-3);}

  .intro{min-height:calc(100vh - 60px); display:grid; align-items:center; padding-block:48px 64px;}
  .intro-in{max-width:880px;}
  .intro-grid{display:grid; grid-template-columns:minmax(0,1fr) 300px; gap:56px; align-items:center;}
  @media (max-width:1000px){ .intro-grid{grid-template-columns:minmax(0,1fr);} .gauge{display:none;} }
  .gauge{border:1px solid var(--line-2); border-radius:8px; background:var(--ink-2); padding:18px; box-shadow:0 30px 80px -40px rgba(0,0,0,.9);}
  .gauge .gh{display:flex; justify-content:space-between; font-family:var(--mono); font-size:.64rem; letter-spacing:.14em; color:var(--faint); text-transform:uppercase;}
  .gauge .gh b{color:var(--alert); font-weight:500;}
  .gauge svg{display:block; width:100%; height:auto; margin-top:12px;}
  .gauge svg text{font-family:var(--mono); font-size:10px; fill:var(--faint);}
  .gauge .lv{font-family:var(--mono); font-size:1.8rem; font-variant-numeric:tabular-nums; margin-top:6px;}
  .gauge .lv small{font-size:.75rem; color:var(--faint); margin-left:6px;}
  .gauge ul{list-style:none; margin-top:14px; border-top:1px solid var(--line);}

  .eyebrow b{color:var(--gold); font-weight:500;}
  .intro h1{font-family:var(--serif); font-weight:300; font-size:clamp(3.6rem,13vw,9.5rem); line-height:.9; letter-spacing:-.04em; margin-top:34px;}

  .intro .meta{display:flex; flex-wrap:wrap; gap:8px; margin-top:26px;}

  .idcard .v{font-family:var(--mono); font-size:1.1rem; letter-spacing:.1em; color:var(--gold); margin-bottom:6px;}
  .rep-sys{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:14px; margin-top:28px;}
  @media (max-width:820px){ .rep-sys{grid-template-columns:1fr;} }
  .rep-sys .sys{background:var(--ink-2);}
  .big{font-family:var(--mono); font-size:2rem; font-weight:500; color:var(--paper); font-variant-numeric:tabular-nums; line-height:1.1;}
  .big small{font-size:.9rem; color:var(--faint);}
  .rep-sec{margin-top:44px;}
  .rep-sec h2{font-family:var(--serif); font-weight:400; font-size:1.9rem;}
  .meter{height:10px; background:var(--ink-4); border-radius:5px; overflow:hidden; margin-top:10px;}
  .meter i{display:block; height:100%; background:var(--gold); transition:width 1s var(--ease);}
  .reflect{list-style:none; counter-reset:q; display:grid; gap:12px; margin-top:16px;}
  .reflect li{counter-increment:q; display:grid; grid-template-columns:34px 1fr; gap:8px; font-family:var(--serif); font-size:1.15rem; color:var(--dim); font-weight:300;}
  .reflect li::before{content:counter(q, decimal-leading-zero); font-family:var(--mono); font-size:.72rem; color:var(--gold); padding-top:6px;}
  .fb{border:1px solid var(--line-2); border-radius:8px; background:var(--ink-2); padding:22px 20px; margin-top:16px; display:grid; gap:18px;}
  .scale{display:flex; flex-wrap:wrap; gap:8px; margin-top:8px;}
  .scale button{width:46px; height:46px; border:1px solid var(--line-3); border-radius:4px; background:none; font-family:var(--mono); font-size:1rem; color:var(--dim);}
  .scale button[aria-pressed="true"]{background:var(--gold); color:var(--ink); border-color:var(--gold);}
  .scale-lbl{display:flex; justify-content:space-between; max-width:270px; font-family:var(--mono); font-size:.62rem; letter-spacing:.1em; color:var(--faint); text-transform:uppercase; margin-top:6px;}
  .fb label, .fb .q{font-weight:500; font-size:.98rem;}
  textarea.field{min-height:84px; resize:vertical; font-family:var(--sans);}
  a.btn{text-decoration:none;}
  .small{font-size:.82rem; color:var(--faint);}
  footer.foot{position:relative; z-index:1; text-align:center; font-family:var(--mono); font-size:.68rem; letter-spacing:.1em; color:var(--faint); padding:0 16px 34px;}
  footer.foot a{color:var(--dim);}

  @media (prefers-reduced-motion: reduce){

    .tcard .tc-in > *{opacity:1; transform:none;}
  }

      g += '<text x="40" y="216" style="letter-spacing:.1em">RAIN TODAY (MM) →</text>';
      g += '<rect x="'+px(t)+'" y="20" width="'+(px(XMAX)-px(t))+'" height="150" fill="rgba(255,200,0,.08)"/>';

      g += '<text x="44" y="66" style="fill:var(--dim)">FLOODED</text><text x="44" y="132" style="fill:var(--dim)">DRY</text>';
      var placed = {};

        g += r[2] ? '<circle cx="'+px(r[0])+'" cy="'+y+'" r="7" fill="var(--gold)" '+(wrong?'stroke="var(--alert)" stroke-width="3"':'')+'/>'

      });
      g += '<line x1="'+px(t)+'" y1="16" x2="'+px(t)+'" y2="172" stroke="var(--gold)" stroke-width="2"/>';
      g += '<rect class="hit" x="'+(px(t)-18)+'" y="10" width="36" height="166"/>';
      g += '<circle class="handle" cx="'+px(t)+'" cy="16" r="9"/><text x="'+px(t)+'" y="11" text-anchor="middle" style="fill:var(--paper)" dy="-8">'+Math.round(t)+' mm</text>';
      svg.innerHTML = g;
      var ok = 0, miss = 0, fa = 0;
      TRAIN.forEach(function(r){ var p = r[0] >= t; if(p === !!r[2]) ok++; else if(r[2]) miss++; else fa++; });
      $('#s1c').innerHTML = ok+'<small>/24</small>'; $('#s1m').textContent = miss; $('#s1f').textContent = fa;
      if(ok > best){ best = ok; }
      if(ok >= 18 && !$('#lock1')){
        sfx('ok');
        $('#fb2').innerHTML = '<div class="callout">'+ic('spark')+'<p><b>18 out of 24 — and that is the best any single threshold can do.</b> Look at the overlap: some days with 100 mm of rain flooded, others with 130 mm didn\'t. Today\'s rain alone isn\'t enough. Something else matters.</p></div>';
        $('#act2').innerHTML = '<button class="btn" id="lock1" type="button">Add the second clue '+ic('arrow')+'</button>';
        $('#lock1').onclick = function(){ S.stats.oneClue = ok; save(); obj(2); twoClues(Math.round(t)); };
      }
    }
    var drag = false;
    function move(e){ var r = svg.getBoundingClientRect(); var p = (e.clientX - r.left) / r.width * 640; t = Math.round(vx(p)); $('#r1').value = t; draw(); }
    svg.addEventListener('pointerdown', function(e){ drag = true; svg.setPointerCapture(e.pointerId); move(e); });
    svg.addEventListener('pointermove', function(e){ if(drag) move(e); });

  }

  /* ---- two clues: draggable line ---- */
  function twoClues(t0){
    var A = {x:t0, y:0}, B = {x:t0, y:YMAX}, done = false;
    var L = 56, R = 620, T = 18, Bm = 380;
    function sx(v){ return L + v/XMAX*(R-L); } function sy(v){ return Bm - v/YMAX*(Bm-T); }
    function ix(p){ return Math.max(0, Math.min(XMAX, (p-L)/(R-L)*XMAX)); } function iy(p){ return Math.max(0, Math.min(YMAX, (Bm-p)/(Bm-T)*YMAX)); }
    body(
      '<div class="step">Step 3 of 5 · Train with two clues</div>'+
      '<h3>Same days, now spread out by the rain that fell before.</h3>'+
      '<p class="lead">Wet ground can\'t soak up more water. Drag the two <b>gold handles</b> to tilt the line until the flooded days sit on the gold side. Aim for <b>22 of 24</b> or better.</p>'+
      '<div class="chart-wrap"><svg class="chart" id="c2" viewBox="0 0 640 420" role="img" aria-label="Scatter of past days by rain today and rain in the previous three days, with a draggable dividing line"></svg></div>'+
      '<div class="legend"><span><i class="f"></i>Flooded day</span><span><i class="d"></i>Dry day</span><span id="lgT" hidden><i class="t"></i>Test day</span></div>'+
      '<div class="mt">'+stats3([['Training accuracy','—','','s2a'],['Missed floods','—','var(--alert)','s2m'],['False alarms','—','','s2f']])+'</div>'+
      '<div id="fb3" class="mt"></div><div class="row mt" id="act3"></div>');
    var svg = $('#c2'), testShown = 0, tonight = false;
    function side(p){ return (B.x-A.x)*(p[1]-A.y) - (B.y-A.y)*(p[0]-A.x); }
    function ref(){ var s = side([XMAX, YMAX]); return s === 0 ? side([XMAX, 0]) : s; }
    function pred(p){ var r = ref(), s = side(p); return r === 0 ? false : (s === 0 ? false : (s > 0) === (r > 0)); }
    function shade(){
      var r = ref(), poly = [[0,0],[XMAX,0],[XMAX,YMAX],[0,YMAX]], out = [];
      for(var i=0;i<4;i++){
        var P = poly[i], Q = poly[(i+1)%4], sp = side(P), sq = side(Q);
        var inP = r !== 0 && sp * r >= 0, inQ = r !== 0 && sq * r >= 0;
        if(inP) out.push(P);
        if(inP !== inQ && sp !== sq){ var k = sp / (sp - sq); out.push([P[0]+(Q[0]-P[0])*k, P[1]+(Q[1]-P[1])*k]); }
      }
      return out.map(function(p){ return sx(p[0]).toFixed(1)+','+sy(p[1]).toFixed(1); }).join(' ');
    }
    function lineEnds(){
      var dx = B.x-A.x, dy = B.y-A.y, ts = [];
      [[0,'x'],[XMAX,'x'],[0,'y'],[YMAX,'y']].forEach(function(e){
        var tt = e[1]==='x' ? (dx ? (e[0]-A.x)/dx : null) : (dy ? (e[0]-A.y)/dy : null);
        if(tt === null) return;
        var X = A.x+dx*tt, Y = A.y+dy*tt;
        if(X >= -0.01 && X <= XMAX+.01 && Y >= -.01 && Y <= YMAX+.01) ts.push([X,Y]);
      });
      ts.sort(function(a,b){ return a[0]-b[0] || a[1]-b[1]; });
      return ts.length >= 2 ? [ts[0], ts[ts.length-1]] : [[A.x,A.y],[B.x,B.y]];
    }
    function draw(){
      var g = '';
      for(var v=0; v<=XMAX; v+=40){ g += '<line class="gr" x1="'+sx(v)+'" y1="'+T+'" x2="'+sx(v)+'" y2="'+Bm+'"/><text x="'+sx(v)+'" y="'+(Bm+18)+'" text-anchor="middle">'+v+'</text>'; }
      for(var w=0; w<=YMAX; w+=40){ g += '<line class="gr" x1="'+L+'" y1="'+sy(w)+'" x2="'+R+'" y2="'+sy(w)+'"/><text x="'+(L-8)+'" y="'+(sy(w)+4)+'" text-anchor="end">'+w+'</text>'; }
      g += '<text x="'+R+'" y="'+(Bm+38)+'" text-anchor="end" style="letter-spacing:.1em">RAIN TODAY (MM) →</text>';
      g += '<text x="'+(L+4)+'" y="'+(T+12)+'" style="letter-spacing:.1em">↑ RAIN, PAST 3 DAYS (MM)</text>';
      g += '<polygon points="'+shade()+'" fill="rgba(255,200,0,.08)"/>';
      var e = lineEnds();
      g += '<line x1="'+sx(e[0][0])+'" y1="'+sy(e[0][1])+'" x2="'+sx(e[1][0])+'" y2="'+sy(e[1][1])+'" stroke="var(--gold)" stroke-width="2"/>';
      var ok = 0, miss = 0, fa = 0;
      TRAIN.forEach(function(r){
        var p = pred(r), wrong = p !== !!r[2];
        if(!wrong) ok++; else if(r[2]) miss++; else fa++;
        g += r[2] ? '<circle cx="'+sx(r[0])+'" cy="'+sy(r[1])+'" r="7" fill="var(--gold)" '+(wrong?'stroke="var(--alert)" stroke-width="3"':'')+'/>'
                  : '<circle cx="'+sx(r[0])+'" cy="'+sy(r[1])+'" r="6" fill="var(--ink)" stroke="'+(wrong?'var(--alert)':'var(--paper)')+'" stroke-width="2"/>';
      });
      for(var i=0;i<testShown;i++){
        var q = TEST[i], qp = pred(q), qok = qp === !!q[2], X = sx(q[0]), Y = sy(q[1]);
        g += '<rect x="'+(X-7)+'" y="'+(Y-7)+'" width="14" height="14" transform="rotate(45 '+X+' '+Y+')" fill="var(--water)" stroke="'+(qok?'var(--ok)':'var(--alert)')+'" stroke-width="3"/>';
      }
      if(tonight){
        var TX = sx(TONIGHT[0]), TY = sy(TONIGHT[1]);
        g += '<circle cx="'+TX+'" cy="'+TY+'" r="16" fill="none" stroke="var(--alert)" stroke-width="2"><animate attributeName="r" values="10;22;10" dur="1.8s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;.2;1" dur="1.8s" repeatCount="indefinite"/></circle>';
        g += '<circle cx="'+TX+'" cy="'+TY+'" r="6" fill="var(--alert)"/><text x="'+(TX+14)+'" y="'+(TY-12)+'" style="fill:var(--paper)">TONIGHT</text>';
      }
      [A,B].forEach(function(h, i){ g += '<circle class="hit" data-h="'+i+'" cx="'+sx(h.x)+'" cy="'+sy(h.y)+'" r="22"/><circle class="handle" data-h="'+i+'" cx="'+sx(h.x)+'" cy="'+sy(h.y)+'" r="10"/>'; });
      svg.innerHTML = g;
      $('#s2a').innerHTML = ok+'<small>/24</small>'; $('#s2m').textContent = miss; $('#s2f').textContent = fa;
      if(ok >= 22 && !done){
        done = true; sfx('ok'); addNote('training'); status('Trained','busy');
        $('#fb3').innerHTML = '<div class="callout good">'+ic('check')+'<p><b>'+ok+' of 24.</b> With two features the pattern appears: floods happen when <b>today\'s rain and the rain before it add up</b>. You just trained a model — real systems do the same thing automatically, with thousands of examples.</p></div>';
        $('#act3').innerHTML = '<button class="btn" id="test1" type="button">Test it on 6 new days '+ic('arrow')+'</button><span class="small">You can keep adjusting first.</span>';

    }
    var dragging = -1;
    function pt(e){ var r = svg.getBoundingClientRect(); return {x: ix((e.clientX-r.left)/r.width*640), y: iy((e.clientY-r.top)/r.height*420)}; }
    svg.addEventListener('pointerdown', function(e){
      var h = e.target.getAttribute && e.target.getAttribute('data-h');
      if(h === null){
        var p = pt(e), dA = Math.hypot(p.x-A.x, (p.y-A.y)*1.37), dB = Math.hypot(p.x-B.x, (p.y-B.y)*1.37);

    });
    svg.addEventListener('pointermove', function(e){
      if(dragging < 0) return;
      var p = pt(e), H = dragging ? B : A, O = dragging ? A : B;
      if(Math.hypot(p.x-O.x, p.y-O.y) < 12) return;
      H.x = p.x; H.y = p.y; draw();
    });
    svg.addEventListener('pointerup', function(){ if(dragging >= 0) sfx('tick'); dragging = -1; });
    draw();

    async function runTest(){
      $('#test1').disabled = true; obj(3); status('Testing','busy'); $('#lgT').hidden = false;
      var trainAcc = draw();
      for(var i=1;i<=TEST.length;i++){ testShown = i; draw(); sfx('tick'); await wait(420); }
      var tok = TEST.filter(function(q){ return pred(q) === !!q[2]; }).length;
      S.stats.data = {train: trainAcc, test: tok}; save();
      addNote('testing');
      $('#fb3').innerHTML = '<div class="callout '+(tok>=5?'good':'')+'">'+ic(tok>=5?'check':'spark')+'<p><b>Test accuracy: '+tok+' of 6 ('+Math.round(tok/6*100)+'%).</b> These blue days were never used in training. '+(tok>=5?'Your line works on new data, so RIVERCAST learned a real pattern rather than memorising the past.':'Some new days landed on the wrong side. A line that fits the past perfectly can still fail on the future, which is why we always test.')+'</p></div>';
      $('#act3').innerHTML = '<button class="btn" id="fc" type="button">Forecast tonight '+ic('arrow')+'</button>';
      $('#fc').onclick = forecast;
    }
    function forecast(){
      obj(4); tonight = true; draw(); sfx('tick');
      var f = pred(TONIGHT);
      S.stats.forecast = f; save();
      status('Online','on');
      $('#fb3').innerHTML = '<div class="callout '+(f?'bad':'')+'">'+ic('alert')+'<p><b>Tonight: '+TONIGHT[0]+' mm today, '+TONIGHT[1]+' mm in the past three days. RIVERCAST says: '+(f?'FLOOD LIKELY.':'NO FLOOD.')+'</b> '+(f?'Tonight sits deep on the flood side of your line, wetter than most past flood days.':'Your line puts tonight on the dry side, but it is wetter than most past flood days. Real forecasters would question a model before trusting it.')+'</p></div>';
      $('#act3').innerHTML = '<button class="btn" id="warn" type="button">'+ic('send')+' Issue the flood warning</button>';
      $('#warn').onclick = function(){ S.done = Math.max(S.done, 1); save(); sfx('ok'); setClock('19:30'); ch2(); };
    }
  }
}

function rng(seed){ var a = seed >>> 0; return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; var t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

/* Draws an underpass camera frame. p = {f: water level 0..1, n: night, c: camera no., s: seed, car} */
function drawScene(cv, p, hud){
  var W = cv.width, H = cv.height, x = cv.getContext('2d');

  // ceiling and back
  x.fillStyle = sh(48,49,52); x.fillRect(0,0,320,200);
  // far exit (sky)
  var sky = x.createLinearGradient(0,58,0,102); sky.addColorStop(0, sh(196,203,209)); sky.addColorStop(1, sh(158,165,170));
  x.fillStyle = sky; x.fillRect(128,58,64,44);
  // far buildings in the exit
  x.fillStyle = sh(120,124,128); x.fillRect(132,78,10,24); x.fillRect(146,70,8,32); x.fillRect(170,74,12,28); x.fillRect(184,82,6,20);
  // ceiling slab
  x.fillStyle = sh(92,93,92); x.beginPath(); x.moveTo(0,0); x.lineTo(320,0); x.lineTo(192,58); x.lineTo(128,58); x.closePath(); x.fill();
  for(var k=0;k<5;k++){ var yy = 6 + k*11, xl = 128*(yy/58), xr = 320-(128*(yy/58)); x.fillStyle = 'rgba(255,236,170,.85)'; var lw = (xr-xl)*0.05; x.fillRect(160-lw/2, yy, lw, 1.6+(4-k)*.5); }
  // walls
  x.fillStyle = sh(138,138,134);
  x.beginPath(); x.moveTo(0,0); x.lineTo(128,58); x.lineTo(128,102); x.lineTo(0,200); x.closePath(); x.fill();
  x.beginPath(); x.moveTo(320,0); x.lineTo(192,58); x.lineTo(192,102); x.lineTo(320,200); x.closePath(); x.fill();
  x.strokeStyle = 'rgba(40,40,40,.35)'; x.lineWidth = 1;
  for(var s=0;s<6;s++){ var f = s/6, lx = 128*f*f*1.0, ly1 = 58*f, ly2 = 200-98*f; x.beginPath(); x.moveTo(lx, ly1); x.lineTo(lx, ly2); x.stroke(); x.beginPath(); x.moveTo(320-lx, ly1); x.lineTo(320-lx, ly2); x.stroke(); }

  x.fillStyle = 'rgba(70,60,45,.25)'; x.beginPath(); x.moveTo(0,150); x.lineTo(128,92); x.lineTo(128,102); x.lineTo(0,200); x.fill();
  x.beginPath(); x.moveTo(320,150); x.lineTo(192,92); x.lineTo(192,102); x.lineTo(320,200); x.fill();
  // road
  x.fillStyle = sh(86,87,90); x.beginPath(); x.moveTo(0,200); x.lineTo(128,102); x.lineTo(192,102); x.lineTo(320,200); x.closePath(); x.fill();
  x.fillStyle = 'rgba(235,235,225,.8)';
  for(var d=0; d<6; d++){ var y1 = 104 + d*17, y2 = y1 + 8, w1 = 1 + (y1-102)*0.035, w2 = 1 + (y2-102)*0.035; x.beginPath(); x.moveTo(160-w1, y1); x.lineTo(160+w1, y1); x.lineTo(160+w2, y2); x.lineTo(160-w2, y2); x.fill(); }
  // car
  if(p.car){
    var cx = p.car === 2 ? 96 : 206, cy = 150, col = p.car === 2 ? [70,72,76] : [214,214,210];
    x.fillStyle = 'rgba(0,0,0,.35)'; x.fillRect(cx-36, cy+16, 72, 6);
    x.fillStyle = sh(col[0],col[1],col[2]); x.beginPath(); x.moveTo(cx-38, cy+16); x.lineTo(cx-38, cy+2); x.lineTo(cx-24, cy-2); x.lineTo(cx-16, cy-16); x.lineTo(cx+16, cy-16); x.lineTo(cx+26, cy-2); x.lineTo(cx+38, cy+2); x.lineTo(cx+38, cy+16); x.closePath(); x.fill();
    x.fillStyle = 'rgba(30,36,44,.9)'; x.beginPath(); x.moveTo(cx-20, cy-2); x.lineTo(cx-13, cy-13); x.lineTo(cx+13, cy-13); x.lineTo(cx+21, cy-2); x.closePath(); x.fill();
    x.fillStyle = 'rgb(20,20,20)'; x.fillRect(cx-30, cy+14, 12, 6); x.fillRect(cx+18, cy+14, 12, 6);
    x.fillStyle = 'rgba(255,210,120,.9)'; x.fillRect(cx-37, cy+5, 5, 3); x.fillRect(cx+32, cy+5, 5, 3);

  for(var r=0;r<26;r++){ var a = R()*320, b = R()*200; x.moveTo(a,b); x.lineTo(a-2, b+6+R()*6); }

    x.font = '600 8px "IBM Plex Mono", monospace'; x.fillStyle = 'rgba(255,255,255,.9)'; x.textBaseline = 'middle';

    x.textAlign = 'right'; x.fillText(p.n ? '23:4'+(p.s%10)+':0'+(p.s%7) : '17:2'+(p.s%10)+':1'+(p.s%7), 314, 7); x.textAlign = 'left';

}

/* Features measured from the pixels the model actually receives. */
var FEAT_CANVAS = document.createElement('canvas'); FEAT_CANVAS.width = 160; FEAT_CANVAS.height = 100;
function features(p){
  drawScene(FEAT_CANVAS, p, true);
  var x = FEAT_CANVAS.getContext('2d'), d = x.getImageData(0, 0, 160, 100).data, blue = 0, nb = 0, lum = 0, nl = 0;
  for(var y=8; y<100; y++){
    for(var i=0; i<160; i++){
      var o = (y*160+i)*4, r = d[o], g = d[o+1], b = d[o+2];
      lum += (r+g+b)/3; nl++;
      if(y >= 75){ blue += b - (r+g)/2; nb++; }
    }
  }
  return {b: blue/nb, l: lum/nl};
}
function fx(f){ return [Math.max(0, f.b)/30, f.l/120]; }
function nearest(train, q){
  var best = null, bd = 1e9, Q = fx(q.feat);
  train.forEach(function(t){ var T = fx(t.feat), dd = Math.hypot(T[0]-Q[0], T[1]-Q[1]); if(dd < bd){ bd = dd; best = t; } });
  return best;
}

      d.appendChild(sceneCanvas(p, 320, 200));
      var lb = document.createElement('div'); lb.className = 'lb';
      lb.innerHTML = '<button type="button" class="fl" aria-pressed="false">Flooded</button><button type="button" aria-pressed="false">Clear</button>';
      d.appendChild(lb); box.appendChild(d);
      var bs = lb.querySelectorAll('button');
      [0,1].forEach(function(k){ bs[k].onclick = function(){ lab[i] = k === 0; bs[k].setAttribute('aria-pressed','true'); bs[1-k].setAttribute('aria-pressed','false'); d.classList.remove('wrong'); sfx('tick'); var n = Object.keys(lab).length; $('#cnt5').textContent = n+' of '+set.length+' labelled'; $('#chk5').disabled = n < set.length; }; });

  function scatter(train, test){
    var W = 640, H = 300, L = 54, R = 620, T = 16, B = 256;
    function sx(v){ return L + Math.min(v,1.25)/1.25*(R-L); } function sy(v){ return B - Math.min(v,1.4)/1.4*(B-T); }
    var g = '';
    for(var i=0;i<=5;i++){ g += '<line class="gr" x1="'+sx(i*.25)+'" y1="'+T+'" x2="'+sx(i*.25)+'" y2="'+B+'"/>'; }
    for(var j=0;j<=4;j++){ g += '<line class="gr" x1="'+L+'" y1="'+sy(j*.35)+'" x2="'+R+'" y2="'+sy(j*.35)+'"/>'; }
    g += '<text x="'+R+'" y="'+(B+22)+'" text-anchor="end" style="letter-spacing:.1em">BLUENESS AT ROAD LEVEL →</text><text x="'+(L+4)+'" y="'+(T+12)+'" style="letter-spacing:.1em">↑ BRIGHTNESS</text>';
    g += '<text x="'+(L+4)+'" y="'+(B+22)+'">grey</text>';
    train.forEach(function(t){ var v = fx(t.feat); g += t.label ? '<circle cx="'+sx(v[0])+'" cy="'+sy(v[1])+'" r="7" fill="var(--gold)"/>' : '<circle cx="'+sx(v[0])+'" cy="'+sy(v[1])+'" r="6" fill="var(--ink)" stroke="var(--paper)" stroke-width="2"/>'; });
    (test||[]).forEach(function(t){ var v = fx(t.feat), X = sx(v[0]), Y = sy(v[1]); g += '<rect x="'+(X-7)+'" y="'+(Y-7)+'" width="14" height="14" transform="rotate(45 '+X+' '+Y+')" fill="var(--water)" stroke="'+(t.ok?'var(--ok)':'var(--alert)')+'" stroke-width="3"/>'; if(t.n) g += '<text x="'+(X+11)+'" y="'+(Y+4)+'" style="fill:var(--dim)">night</text>'; });
    return '<div class="chart-wrap"><svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Training photos plotted by blueness and brightness">'+g+'</svg></div>';
  }

      }
      $('#sc6').innerHTML = stats3([['Test accuracy', ok+'<small>/6</small>', ok===6?'var(--ok)':''],['Night cameras right', res.filter(function(r){ return r.p.n && r.ok; }).length+'<small>/'+res.filter(function(r){ return r.p.n; }).length+'</small>'],['Training photos', trainSet.length]]) +
        scatter(trainSet, res.map(function(r){ return {feat:r.p.feat, ok:r.ok, n:r.p.n}; }));
      if(!fixed){
        S.stats.cvBefore = ok; save();
        addNote('coverage');
        $('#fb6').innerHTML = '<div class="callout bad">'+ic('alert')+'<p><b>STREETEYE called empty roads "flooded" at night.</b> Every photo you trained it on was taken in daylight. At night the whole frame turns dark and blue-tinted, which lands those dots right next to your flooded photos. STREETEYE isn\'t careless: it has simply <b>never seen a night</b>. Gaps in training data turn into wrong, and biased, decisions.</p></div>';
        $('#act6').innerHTML = '<button class="btn" id="fix" type="button">Add night photos to training '+ic('arrow')+'</button>';
        $('#fix').onclick = function(){ obj(3); label(CV.night, 'Step 4 of 4 · Fix the gap', 'Label 4 night-time photos.', 'Same job as before, in the dark. Look for the water line across the road.', function(){ CV.night.forEach(function(p){ p.feat = features(p); }); test(CV.day.concat(CV.night), true); }); };
      } else {
        S.stats.cvAfter = ok; save(); status('Online','on');
        $('#fb6').innerHTML = '<div class="callout good">'+ic('check')+'<p><b>'+S.stats.cvBefore+'/6 before, '+ok+'/6 after.</b> You didn\'t change the algorithm at all, only the data it learned from. In computer vision, <b>what you train on matters as much as how you train</b>.</p></div>';
        $('#act6').innerHTML = '<button class="btn" id="dep" type="button">'+ic('camera')+' Put STREETEYE on all 40 cameras</button>';
        $('#dep').onclick = function(){ S.done = Math.max(S.done, 2); save(); sfx('ok'); setClock('21:00'); ch3(); };
      }
    })();
  }

function tokens(s){ return (s.toLowerCase().replace(/[’']/g,'').match(/[a-z0-9]+/g) || []); }
function content(s){ return tokens(s).filter(function(t){ return STOP.indexOf(t) < 0; }); }

function trainNB(rows){
  var c = {1:{}, 0:{}}, n = {1:0, 0:0}, w = {1:0, 0:0}, vocab = {};
  rows.forEach(function(r){ var y = r[1] ? 1 : 0; n[y]++; content(r[0]).forEach(function(t){ c[y][t] = (c[y][t]||0)+1; w[y]++; vocab[t] = 1; }); });
  var V = Object.keys(vocab).length;
  function lp(t, y){ return Math.log(((c[y][t]||0)+1) / (w[y]+V)); }
  return {
    vocab:vocab, c:c,
    weight:function(t){ return vocab[t] ? lp(t,1) - lp(t,0) : 0; },
    predict:function(s){
      var toks = content(s), sc = Math.log(n[1]/(n[0]+n[1])) - Math.log(n[0]/(n[0]+n[1])), parts = [];
      toks.forEach(function(t){ if(!vocab[t]) { parts.push([t, 0]); return; } var wv = lp(t,1) - lp(t,0); sc += wv; parts.push([t, wv]); });
      return {urgent: sc > 0, score: sc, parts: parts};
    }
  };
}

      '<div class="bank" id="bank">'+BANK.map(function(w){ return '<button type="button" class="chip" aria-pressed="false" data-w="'+w+'">'+w+'</button>'; }).join('')+'</div>'+
      '<div class="row mt"><button class="btn" id="run8" type="button" disabled>Run my rules on 8 messages</button><span class="small" id="pk">0 of 4 chosen</span></div>'+
      '<div class="mlist" id="ml8"></div><div id="sc8" class="mt"></div><div id="fb8" class="mt"></div><div class="row mt" id="act8"></div>');
    $$('#bank .chip').forEach(function(b){
      b.onclick = function(){
        var w = b.getAttribute('data-w'), n = Object.keys(pick).filter(function(k){ return pick[k]; }).length;
        if(!pick[w] && n >= 4){ sfx('bad'); return; }
        pick[w] = !pick[w]; b.setAttribute('aria-pressed', pick[w]); sfx('tick');
        n = Object.keys(pick).filter(function(k){ return pick[k]; }).length;

    $('#run8').onclick = async function(){
      this.disabled = true; $$('#bank .chip').forEach(function(b){ b.disabled = true; });
      var words = Object.keys(pick).filter(function(k){ return pick[k]; }), ok = 0, kinds = {};
      for(var i=0;i<TESTR.length;i++){
        var m = TESTR[i], tk = tokens(m[0]), hit = tk.filter(function(t){ return words.indexOf(t) >= 0; }), u = hit.length > 0, good = u === !!m[1];
        if(good) ok++;
        var why = good ? (u ? 'Matched <b>'+hit.join(', ')+'</b>.' : 'No rule words, correctly left alone.') :
          (u ? 'Fooled by <b>'+hit.join(', ')+'</b>. The words are there, the emergency isn\'t.' :
           (m[2] ? 'Missed. Your rules only know English words.' : 'Missed. A real emergency, described in words you didn\'t pick.'));
        if(!good) kinds[u ? 'fool' : (m[2] ? 'lang' : 'miss')] = 1;
        $('#ml8').insertAdjacentHTML('beforeend', '<div class="mrow fade"><div><div class="tx">'+m[0]+'</div>'+(m[2]?'<div class="gl">'+m[2]+'</div>':'')+'<div class="ex">'+why+'</div></div><span class="verdict '+(good?'ok':'no')+'">'+(u?'Urgent':'Not urgent')+(good?' ✓':' ✗')+'</span></div>');

      $('#sc8').innerHTML = stats3([['Rule accuracy', ok+'<small>/8</small>', ok<8?'var(--alert)':''],['Languages handled','1<small>/3</small>'],['Words in your rules', words.length]]);
      addNote('rules');
      $('#fb8').innerHTML = '<div class="callout bad">'+ic('alert')+'<p><b>Rules break in three ways.</b> '+(kinds.fool?'A safe message used an alarming word. ':'')+(kinds.lang?'Emergencies in Hindi and Telugu slipped past. ':'')+(kinds.miss?'An emergency used words nobody thought to add. ':'')+'No list of keywords can cover how 1.4 billion people actually write. So instead of writing rules, we show HELPLINE examples and let it find the patterns itself.</p></div>';
      $('#act8').innerHTML = '<button class="btn" id="go8" type="button">Teach by example '+ic('arrow')+'</button>';

  }

  function teach(){
    var lab = {};
    body(
      '<div class="step">Step 3 of 4 · Teach by example</div>'+
      '<h3>Label 12 real messages. HELPLINE learns from your labels.</h3>'+
      '<p class="lead">Volunteers already labelled 30 messages earlier tonight. Add yours and HELPLINE will learn <b>which words show up more in urgent messages</b>, in any language, without anyone writing a rule.</p>'+
      '<div class="mlist" id="ml9">'+YOURS.map(function(m, i){ return '<div class="mrow"><div><div class="tx">'+m[0]+'</div>'+(m[2]?'<div class="gl">'+m[2]+'</div>':'')+'</div><div class="seg" role="group" aria-label="Label"><button type="button" class="u" data-i="'+i+'" data-v="1" aria-pressed="false">Urgent</button><button type="button" class="n" data-i="'+i+'" data-v="0" aria-pressed="false">Not urgent</button></div></div>'; }).join('')+'</div>'+
      '<div class="row mt"><button class="btn" id="tr9" type="button" disabled>Train HELPLINE</button><span class="small" id="c9">0 of 12 labelled</span></div>'+
      '<div id="out9"></div>');
    $$('#ml9 .seg button').forEach(function(b){
      b.onclick = function(){
        var i = +b.getAttribute('data-i'); lab[i] = b.getAttribute('data-v') === '1';
        b.parentNode.querySelectorAll('button').forEach(function(x){ x.setAttribute('aria-pressed', x === b); }); sfx('tick');
        var n = Object.keys(lab).length; $('#c9').textContent = n+' of 12 labelled'; $('#tr9').disabled = n < 12;
      };
    });
    $('#tr9').onclick = function(){
      this.disabled = true; $$('#ml9 .seg button').forEach(function(b){ b.disabled = true; });
      status('Training','busy');
      var agree = YOURS.filter(function(m, i){ return lab[i] === !!m[1]; }).length;
      var rows = BASE.concat(YOURS.map(function(m, i){ return [m[0], lab[i] ? 1 : 0]; }));
      var nb = trainNB(rows);
      var ws = Object.keys(nb.vocab).map(function(t){ return [t, nb.weight(t)]; });
      var up = ws.slice().sort(function(a,b){ return b[1]-a[1]; }).slice(0,8), dn = ws.slice().sort(function(a,b){ return a[1]-b[1]; }).slice(0,8);
      var mx = Math.max(up[0][1], -dn[0][1]);
      function bars(list, col){ return list.map(function(w){ return '<div class="wbar"><span>'+w[0]+'</span><span class="b" style="width:'+Math.max(6, Math.abs(w[1])/mx*100)+'%;background:'+col+'"></span></div>'; }).join(''); }
      $('#out9').innerHTML = '<div class="fade mt2">'+
        (agree < 12 ? '<div class="callout">'+ic('spark')+'<p>You and the volunteers disagreed on <b>'+(12-agree)+'</b> message'+(12-agree>1?'s':'')+'. HELPLINE learns from your labels anyway, which is exactly how human mistakes end up inside AI.</p></div>' : '<div class="callout good">'+ic('check')+'<p>All 12 of your labels match the volunteers\'. Clean labels make a better model.</p></div>')+
        '<div class="wbars"><div><div class="step">Words that push toward urgent</div>'+bars(up,'var(--alert)')+'</div><div><div class="step">Words that push toward not urgent</div>'+bars(dn,'var(--ok)')+'</div></div>'+
        '<p class="small mt">Nobody typed these lists. HELPLINE counted how often each word appeared in urgent and non-urgent messages, then weighted it. Notice <b>paani</b>, <b>neeru</b> and <b>bachche</b>: it learned Hindi and Telugu because the examples were in Hindi and Telugu.</p>'+
        '<div class="row mt"><button class="btn" id="go9" type="button">Open the incoming queue '+ic('arrow')+'</button></div></div>';
      S.stats.labelsAgree = agree; save();
      $('#go9').onclick = function(){ obj(3); queue(nb); };
    };
  }

  function queue(nb){
    body(
      '<div class="step">Step 4 of 4 · The incoming queue</div>'+
      '<h3>Eight new messages. HELPLINE has never seen any of them.</h3>'+
      '<p class="lead">Each verdict shows the tokens that pushed it hardest, in red for urgent and green for not urgent. This is how you check a language model\'s reasoning.</p>'+
      '<div class="mlist" id="ml10"></div><div id="sc10" class="mt"></div><div id="fb10" class="mt"></div><div id="try10"></div>');
    (async function(){
      var ok = 0;
      for(var i=0;i<INCOMING.length;i++){
        var m = INCOMING[i], r = nb.predict(m[0]), good = r.urgent === !!m[1];
        if(good) ok++;
        var top = r.parts.filter(function(p){ return p[1] !== 0; }).sort(function(a,b){ return Math.abs(b[1])-Math.abs(a[1]); }).slice(0,3);
        $('#ml10').insertAdjacentHTML('beforeend', '<div class="mrow fade"><div><div class="tx">'+m[0]+'</div>'+(m[2]?'<div class="gl">'+m[2]+'</div>':'')+'<div class="toks">'+top.map(function(p){ return '<span class="tok '+(p[1]>0?'u':'n')+'">'+p[0]+'</span>'; }).join('')+'</div></div><span class="verdict '+(good?'ok':'no')+'">'+(r.urgent?'Urgent':'Not urgent')+(good?' ✓':' ✗')+'</span></div>');
        sfx(good ? 'tick' : 'bad'); await wait(340);
      }
      S.stats.nlp = ok; save(); status('Online','on');
      addNote('textclf');
      $('#sc10').innerHTML = stats3([['Learned model', ok+'<small>/8</small>', ok>=7?'var(--ok)':''],['Your rules', (S.stats.rules||0)+'<small>/8</small>'],['Languages handled','3<small>/3</small>']]);
      $('#fb10').innerHTML = '<div class="callout good">'+ic('check')+'<p><b>'+ok+' of 8 correct, in three languages</b>, and it handled "not in danger" without anyone writing a rule about the word "not". This is text classification, the same idea behind spam filters, review sorting and the first step of every chatbot.</p></div>';
      $('#try10').innerHTML = '<label class="step mt2" for="t10" style="display:block">Try to fool HELPLINE</label><input class="field mt" id="t10" maxlength="160" autocomplete="off" placeholder="Write a message, in any language you like"><div id="o10" class="mt"></div><div class="row mt2"><button class="btn" id="go10" type="button">'+ic('send')+' Route urgent messages to rescue teams</button></div>';
      $('#t10').oninput = function(){
        var v = this.value.trim(); if(!v){ $('#o10').innerHTML = ''; return; }
        var r = nb.predict(v), known = r.parts.filter(function(p){ return p[1] !== 0; });
        $('#o10').innerHTML = '<div class="row"><span class="verdict '+(r.urgent?'no':'ok')+'">'+(r.urgent?'Urgent':'Not urgent')+'</span><span class="small">'+(known.length ? 'Pushed by: ' : 'It doesn\'t know any of these words, so it falls back on how common urgent messages are.')+'</span></div><div class="toks">'+r.parts.map(function(p){ return '<span class="tok '+(p[1]>0.05?'u':p[1]<-0.05?'n':'')+'">'+esc(p[0])+'</span>'; }).join('')+'</div>';
      };
      $('#go10').onclick = function(){ S.done = Math.max(S.done, 3); save(); sfx('ok'); setClock('22:30'); ch4(); };
    })();
  }
}

var ZONES = [
  {id:'rm', name:'Riverside Market', sub:'Trading streets on the west bank', x:236, y:196, risk:'High', cams:'4 of 5 flooded', camHi:1, msgs:46, need:120},
  {id:'ob', name:'Old Bridge', sub:'Bridge crossing and bus depot', x:372, y:252, risk:'High', cams:'3 of 4 flooded', camHi:1, msgs:31, need:80},
  {id:'kn', name:'Kalyan Nagar', sub:'Low-lying homes on the east bank', x:500, y:338, risk:'High', cams:'No cameras', camNone:1, msgs:3, need:150},
  {id:'tp', name:'Tech Park', sub:'Offices and new apartments', x:128, y:98, risk:'Medium', cams:'1 of 6 flooded', msgs:22, need:15},
  {id:'hc', name:'Hill Colony', sub:'Higher ground to the north', x:520, y:92, risk:'Low', cams:'0 of 3 flooded', msgs:9, need:0}
];
var BOAT = 60;

function ch4(){
  setClock('22:30');
  titleCard({icon:'boat', kicker:'Chapter 4 · Human in the loop', title:'Three boats.<br><em>Five neighbourhoods.</em>', time:'22:30 — 00:00 · THE CALL', line:'Your three AIs have told you everything they know. They cannot decide where the boats go. That part is yours.'}).then(function(){
    screen({ch:3, icon:'boat', kicker:'Chapter 4 · Human in the loop', title:'Send the rescue boats.',
      story:['The river crossed its danger mark at 22:14. Neelapur has three rescue boats, and each can bring about <b>60 people</b> to safety before dawn.','For every neighbourhood you have three readings, one from each AI. Read them carefully. Then decide.'],
      obj:['Read all three AIs for each area','Assign three boats','Dispatch, and see what dawn shows'],
      sys:'FLOOD DESK', sysIcon:'mark', ver:'all systems'});
    status('3 systems online','on');
    obj(0); decide();
  });

  function mapSVG(sel, reveal){
    var g = '<rect width="640" height="420" fill="#0A1016"/>';
    for(var i=0;i<16;i++){ g += '<line x1="'+(i*44-20)+'" y1="0" x2="'+(i*44+60)+'" y2="420" stroke="rgba(243,239,230,.035)"/>'; }
    for(var j=0;j<10;j++){ g += '<line x1="0" y1="'+(j*46+10)+'" x2="640" y2="'+(j*46-30)+'" stroke="rgba(243,239,230,.035)"/>'; }
    var river = 'M -20 128 C 110 150, 170 232, 300 232 S 440 268, 520 336 S 610 410, 680 418';
    g += '<path d="'+river+'" fill="none" stroke="rgba(90,169,230,.10)" stroke-width="96" stroke-linecap="round"/>';
    g += '<path d="'+river+'" fill="none" stroke="#1E3A52" stroke-width="34" stroke-linecap="round"/>';
    g += '<path d="'+river+'" fill="none" stroke="rgba(90,169,230,.55)" stroke-width="1.5" stroke-dasharray="6 10"><animate attributeName="stroke-dashoffset" from="0" to="-32" dur="2s" repeatCount="indefinite"/></path>';
    g += '<text x="40" y="112" fill="rgba(90,169,230,.8)" font-size="11" letter-spacing="3">NEELA RIVER</text>';
    g += '<line x1="356" y1="230" x2="392" y2="276" stroke="rgba(243,239,230,.35)" stroke-width="5"/>';
    ZONES.forEach(function(z){
      var s = sel[z.id], r = reveal ? 12 + Math.sqrt(z.need)*1.6 : 12;
      if(reveal && z.need) g += '<circle cx="'+z.x+'" cy="'+z.y+'" r="'+r+'" fill="rgba(255,107,91,.16)" stroke="rgba(255,107,91,.6)"/>';
      g += '<rect x="'+(z.x-9)+'" y="'+(z.y-9)+'" width="18" height="18" rx="5" fill="'+(s?'#FFC800':'#11141A')+'" stroke="'+(s?'#FFC800':'rgba(243,239,230,.6)')+'" stroke-width="2"/>';
      g += '<rect x="'+(z.x-3)+'" y="'+(z.y-3)+'" width="6" height="6" rx="1.5" fill="'+(s?'#0B0D11':'rgba(243,239,230,.6)')+'"/>';
      var lx = z.x + (z.x > 450 ? -16 : 16), anchor = z.x > 450 ? 'end' : 'start';
      g += '<text x="'+lx+'" y="'+(z.y-4)+'" fill="#F3EFE6" font-size="12" text-anchor="'+anchor+'">'+z.name.toUpperCase()+'</text>';
      g += '<text x="'+lx+'" y="'+(z.y+11)+'" fill="'+(reveal?(z.need?'#FF6B5B':'#7C818C'):(s?'#FFC800':'#7C818C'))+'" font-size="10" text-anchor="'+anchor+'">'+(reveal ? (z.need ? z.need+' stranded' : 'all safe') : (s ? 'BOAT ASSIGNED' : 'risk '+z.risk.toLowerCase()))+'</text>';
    });
    return '<svg class="map" viewBox="0 0 640 420" role="img" aria-label="Map of Neelapur along the Neela river with five neighbourhoods">'+g+'</svg>';
  }

  function decide(){
    var sel = {};
    function left(){ return 3 - Object.keys(sel).filter(function(k){ return sel[k]; }).length; }
    body(
      '<div class="step">Midnight decision</div>'+
      '<h3>Where do the three boats go?</h3>'+
      '<div class="row mt"><span class="small">Boats left</span><span class="boats" id="boats"></span></div>'+

      $('#zones').innerHTML = ZONES.map(function(z){

      }).join('');
      $$('#zones [data-z]').forEach(function(b){ b.onclick = function(){ var id = b.getAttribute('data-z'); sel[id] = !sel[id]; sfx('tick'); obj(1); render(); }; });
      $('#act11').innerHTML = '<button class="btn" id="disp" type="button" '+(n?'disabled':'')+'>'+ic('send')+' Dispatch boats</button>'+(n?'<span class="small">Assign all three boats to dispatch.</span>':'');
      if(!n) $('#disp').onclick = function(){ dispatch(sel); };
    }
    render();
  }

  async function dispatch(sel){
    obj(2); sfx('big');
    $('#act11').innerHTML = ''; $$('#zones button').forEach(function(b){ b.disabled = true; });
    $('#fb11').innerHTML = '<div class="callout">'+ic('clock')+'<p>Boats away at 00:04. The desk goes quiet. The rain keeps falling…</p></div>';
    await wait(1600); setClock('03:00'); await wait(1100); setClock('06:00');
    var reached = 0, total = 0, rows = '';
    ZONES.forEach(function(z){ var r = sel[z.id] ? Math.min(z.need, BOAT) : 0; reached += r; total += z.need; z.reached = r; });
    var knSent = !!sel.kn;
    S.stats.reached = reached; S.stats.kn = knSent; S.done = Math.max(S.done, 4); save();
    $('#map').innerHTML = mapSVG(sel, true);
    $$('#zones .zone').forEach(function(el, i){
      var z = ZONES[i]; el.classList.add('reveal');
      el.insertAdjacentHTML('beforeend', '<div class="out">'+(z.need ? '<b style="color:var(--paper)">'+z.need+' people</b> were stranded here. '+(z.reached ? 'Your boat reached <b style="color:var(--ok)">'+z.reached+'</b>.' : '<span class="alc">No boat came.</span>') : 'No one was stranded. The higher ground held.')+'</div>');
    });
    sfx(knSent ? 'ok' : 'bad');
    addNote('human');
    $('#fb11').innerHTML =
      '<div class="callout '+(knSent?'good':'bad')+'">'+ic(knSent?'check':'alert')+'<p><b>Dawn, 06:00. Your boats reached '+reached+' of '+total+' stranded people'+(reached>=180?', the most three boats could.':'.')+'</b> '+
      (knSent ? 'You sent a boat to Kalyan Nagar even though two of your three AIs were almost silent about it. That was the right call: it had the most people stranded of anywhere in the city.'
              : 'The most people stranded anywhere were in <b>Kalyan Nagar: 150</b>. Two of your three AIs said almost nothing about it.')+'</p></div>'+
      '<div class="callout mt">'+ic('spark')+'<p><b>Why were the AIs quiet?</b> Kalyan Nagar has <b>no cameras</b>, so STREETEYE had nothing to look at. Fewer families there own smartphones, so only <b>3 messages</b> reached HELPLINE. The AIs weren\'t wrong about what they saw. They were blind to the people they couldn\'t see. Only RIVERCAST, working from river data that covers everyone, rated it high risk.</p></div>'+
      '<div class="callout mt">'+ic('person')+'<p><b>This is why AI needs a human in the loop.</b> Missing data doesn\'t show up as a warning. It shows up as silence. Someone has to ask, "who isn\'t in this data?"</p></div>';
    $('#act11').innerHTML = '<button class="btn" id="rep" type="button">Read your field report '+ic('arrow')+'</button>';
    $('#rep').onclick = function(){ S.done = 5; save(); report(); };
  }
}

          '<div><div class="q">How much did you enjoy Flood Desk?</div><div class="scale" data-k="fun">'+[1,2,3,4,5].map(function(n){ return '<button type="button" aria-pressed="false" data-v="'+n+'">'+n+'</button>'; }).join('')+'</div><div class="scale-lbl"><span>Not much</span><span>Loved it</span></div></div>'+
          '<div><div class="q">How well do you now understand the three domains of AI?</div><div class="scale" data-k="und">'+[1,2,3,4,5].map(function(n){ return '<button type="button" aria-pressed="false" data-v="'+n+'">'+n+'</button>'; }).join('')+'</div><div class="scale-lbl"><span>Still confused</span><span>Could teach it</span></div></div>'+
          '<div><div class="q">Would you play another lesson like this?</div><div class="scale" data-k="more"><button type="button" aria-pressed="false" data-v="Yes" style="width:auto;padding:0 18px">Yes</button><button type="button" aria-pressed="false" data-v="Maybe" style="width:auto;padding:0 18px">Maybe</button><button type="button" aria-pressed="false" data-v="No" style="width:auto;padding:0 18px">No</button></div></div>'+
          '<div><label for="fbc">Anything else? <span class="faint">(optional)</span></label><textarea class="field mt" id="fbc" maxlength="400" placeholder="What was the best part? What was confusing?"></textarea></div>'+
          '<div class="row"><a class="btn" id="fbSend" href="#" target="_blank" rel="noopener" aria-disabled="true">'+ic('send')+' Send on WhatsApp</a><span class="small">Opens WhatsApp with your answers filled in. Number: +91 96420 99896</span></div>'+
        '</div></div>'+

      '<div class="row mt3"><button class="btn ghost" id="again" type="button">'+ic('redo')+' Replay the night</button><a class="btn ghost" href="gamified-learning.html">More free lessons</a></div>'+
    '</section>';
  requestAnimationFrame(function(){ var m = $('.meter i'); if(m) m.style.width = m.getAttribute('data-w'); });
  sfx('big');

  var fb = {fun:null, und:null, more:null};
  $$('.scale').forEach(function(s){
    s.querySelectorAll('button').forEach(function(b){
      b.onclick = function(){ fb[s.getAttribute('data-k')] = b.getAttribute('data-v'); s.querySelectorAll('button').forEach(function(x){ x.setAttribute('aria-pressed', x === b); }); sfx('tick'); link(); };
    });
  });
  $('#fbc').oninput = link;
  function link(){
    var a = $('#fbSend'), ready = fb.fun && fb.und;
    var txt = 'Flood Desk feedback (Grade 9)\nEnjoyed: '+(fb.fun||'-')+'/5\nUnderstanding: '+(fb.und||'-')+'/5\nPlay another: '+(fb.more||'-')+
      '\nPeople reached: '+(S.stats.reached||0)+'/180\nTime: '+(mins?mins+' min':'-')+($('#fbc').value.trim() ? '\nComment: '+$('#fbc').value.trim() : '');
    a.href = 'https://wa.me/919642099896?text='+encodeURIComponent(txt);
    a.setAttribute('aria-disabled', ready ? 'false' : 'true');
    a.style.opacity = ready ? '' : '.4';
  }
  link();
  $('#fbSend').addEventListener('click', function(e){ if(this.getAttribute('aria-disabled') === 'true'){ e.preventDefault(); $('.scale').scrollIntoView({block:'center'}); } });
  $('#again').onclick = function(){ var snd = S.sound; S = fresh(); S.sound = snd; save(); notesCount(); intro(); window.scrollTo(0,0); };
  window.scrollTo(0,0);
}

/* ===================================================================== */
var RUN = [ch1, ch2, ch3, ch4, report];
notesCount(); soundUI();
if(S.done >= 5 && S.callsign){ report(); } else { intro(); }
})();
</script>
