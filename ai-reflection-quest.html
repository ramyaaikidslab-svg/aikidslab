<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#15171C">

<meta property="og:locale" content="en_IN">
<meta property="og:url" content="https://www.aikidslab.co/ai-reflection-quest.html">
<meta property="og:title" content="AI Reflection Quest">
<meta property="og:description" content="Six levels. Three AI superpowers. Find the AI hiding in your day, learn how it really works — and beat the boss robot.">
<meta property="og:image" content="https://www.aikidslab.co/og-image.jpg">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  /* Student-facing activity page. Self-contained on purpose: it does not
     load assets/site.css, which is styled for the school-leader pages. It
     keeps the brand ink and gold and adds one colour per AI domain. */
  :root{
    color-scheme: only light;
    --ink:#15171C;
    --ink-2:#2A2F3A;
    --muted:#5B606A;
    --paper:#FFF8E7;
    --card:#FFFFFF;
    --gold:#FFC800;
    --gold-deep:#DFA426;
    --gold-wash:#FFF1C2;

    --data:#2F6FED;  --data-wash:#E4ECFF;
    --cv:#E8453C;    --cv-wash:#FFE5E2;
    --nlp:#109A66;   --nlp-wash:#D9F5E8;

    --good:#109A66; --good-wash:#DDF7EA;
    --bad:#D93A40;  --bad-wash:#FFE3E4;

    --b:3px solid var(--ink);
    --sh:4px 4px 0 var(--ink);
    --sh-sm:2px 2px 0 var(--ink);
    --r:18px;
    --head:'Baloo 2','Trebuchet MS',system-ui,sans-serif;
    --body:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
    --emoji:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{-webkit-text-size-adjust:100%;}
  body{
    font-family:var(--body); font-weight:500; color:var(--ink); line-height:1.5; font-size:17px;
    background-color:var(--paper);
    background-image:radial-gradient(rgba(21,23,28,0.07) 1.2px, transparent 1.3px);
    background-size:22px 22px;
    min-height:100vh;
  }
  h1,h2,h3{font-family:var(--head); font-weight:800; line-height:1.1; letter-spacing:-0.01em;}
  h1{font-size:clamp(2.3rem,7vw,4rem);}
  h2{font-size:clamp(1.6rem,4.5vw,2.3rem);}
  h3{font-size:1.35rem;}
  p{text-wrap:pretty;}
  button{font:inherit; color:inherit;}
  :focus-visible{outline:3px solid var(--data); outline-offset:3px;}
  .wrap{max-width:980px; margin:0 auto; padding:0 16px;}

  /* ---------- HUD ---------- */
  .hud{position:sticky; top:0; z-index:40; background:var(--ink); color:#fff; border-bottom:3px solid var(--gold);}
  .hud .wrap{display:flex; align-items:center; gap:10px; height:62px;}
  .brand{display:flex; align-items:center; gap:9px; font-weight:800; letter-spacing:.12em; font-size:.74rem; text-transform:uppercase; color:#fff; text-decoration:none; margin-right:auto; white-space:nowrap;}
  .brand svg{width:26px; height:26px; flex-shrink:0;}
  .brand svg rect:first-child{fill:none; stroke:var(--gold); stroke-width:10;}
  .brand svg rect:nth-child(2){fill:var(--gold);}
  .brand svg rect:last-child{fill:var(--ink);}
  .pill{display:inline-flex; align-items:center; gap:6px; background:var(--ink-2); border:2px solid rgba(255,255,255,.18); border-radius:999px; padding:5px 12px; min-height:44px; font-weight:800; font-size:.92rem; white-space:nowrap; cursor:pointer;}
  .pill.xp{background:var(--gold); color:var(--ink); border-color:var(--gold);}
  .pill.bump{animation:bump .5s;}
  .iconbtn{background:none; border:2px solid rgba(255,255,255,.25); border-radius:12px; width:44px; height:44px; color:#fff; font-size:1.1rem; cursor:pointer; flex-shrink:0;}
  .iconbtn:hover{border-color:var(--gold);}
  @media (max-width:560px){ .brand .full{display:none;} .pill .lbl{display:none;} .hud .wrap{gap:6px;} .pill{padding:5px 10px;} }
  @keyframes bump{30%{transform:scale(1.25);} 100%{transform:scale(1);}}

  main{padding:28px 0 80px;}

  /* ---------- BUTTONS & CARDS ---------- */
  .btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; font-family:var(--body); font-weight:800; font-size:1rem; background:#fff; border:var(--b); border-radius:14px; padding:11px 18px; box-shadow:var(--sh); cursor:pointer; transition:transform .08s, box-shadow .08s, background .2s; text-align:center; touch-action:manipulation;}
  .btn:hover:not(:disabled){background:#FFFDF5;}
  .btn:active:not(:disabled){transform:translate(3px,3px); box-shadow:1px 1px 0 var(--ink);}
  .btn.primary{background:var(--gold);}
  .btn.primary:hover:not(:disabled){background:#FFD43B;}
  .btn.dark{background:var(--ink); color:#fff;}
  .btn.big{font-size:1.2rem; padding:16px 22px; border-radius:16px;}
  .btn:disabled{opacity:.45; cursor:not-allowed;}
  .btn.sel{background:var(--ink); color:#fff;}
  .card{background:var(--card); border:var(--b); border-radius:var(--r); box-shadow:var(--sh); padding:22px;}
  .kicker{display:inline-block; font-weight:800; font-size:.78rem; letter-spacing:.14em; text-transform:uppercase; color:var(--gold-deep);}
  .muted{color:var(--muted);}
  .row{display:flex; flex-wrap:wrap; gap:12px; align-items:center;}
  .center{text-align:center;}
  .mt{margin-top:18px;} .mt2{margin-top:28px;}
  .pop{animation:pop .35s cubic-bezier(.2,1.4,.4,1);}
  @keyframes pop{0%{transform:scale(.85); opacity:0;} 100%{transform:scale(1); opacity:1;}}
  .shake{animation:shake .4s;}
  @keyframes shake{20%,60%{transform:translateX(-8px);} 40%,80%{transform:translateX(8px);}}

  .dtag{display:inline-flex; align-items:center; gap:5px; font-weight:800; font-size:.82rem; padding:3px 10px; border-radius:999px; border:2px solid currentColor; white-space:nowrap; vertical-align:middle;}
  .dtag.data{color:var(--data); background:var(--data-wash);}
  .dtag.cv{color:var(--cv); background:var(--cv-wash);}
  .dtag.nlp{color:var(--nlp); background:var(--nlp-wash);}

  /* ---------- INTRO ---------- */
  .hero{text-align:center; padding:18px 0 8px;}
  .hero .robot{font-size:5rem; font-family:var(--emoji); display:inline-block; animation:float 3s ease-in-out infinite;}
  @keyframes float{50%{transform:translateY(-10px) rotate(-4deg);}}
  .hero h1 span{background:var(--gold); padding:0 .2em; border-radius:10px; box-decoration-break:clone; -webkit-box-decoration-break:clone;}
  .hero .lede{max-width:44ch; margin:14px auto 0; font-size:1.12rem;}
  .powers{display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin:28px 0;}
  .power{border:var(--b); border-radius:var(--r); padding:16px; box-shadow:var(--sh); text-align:center;}
  .power .pi{font-size:2.4rem; font-family:var(--emoji);}
  .power b{display:block; font-family:var(--head); font-size:1.2rem; line-height:1.15;}
  .power small{font-weight:800; font-size:.8rem; letter-spacing:.08em; text-transform:uppercase;}
  .power.data{background:var(--data-wash);} .power.data small{color:var(--data);}
  .power.cv{background:var(--cv-wash);} .power.cv small{color:var(--cv);}
  .power.nlp{background:var(--nlp-wash);} .power.nlp small{color:var(--nlp);}
  .power.locked{filter:grayscale(1); opacity:.5;}
  @media (max-width:640px){ .powers{grid-template-columns:1fr;} .power{display:flex; align-items:center; gap:14px; text-align:left;} }
  .join{max-width:560px; margin:0 auto;}
  .join label{display:block; font-weight:800; margin-bottom:8px;}
  .input{width:100%; font:inherit; font-weight:700; font-size:1.1rem; border:var(--b); border-radius:14px; padding:12px 14px; background:#fff;}
  textarea.input{min-height:84px; resize:vertical;}
  .avatars{display:flex; flex-wrap:wrap; gap:10px;}
  .avatars button{font-family:var(--emoji); font-size:1.9rem; width:58px; height:58px; border:var(--b); border-radius:16px; background:#fff; cursor:pointer; box-shadow:var(--sh-sm);}
  .avatars button[aria-pressed="true"]{background:var(--gold); transform:translateY(-3px); box-shadow:var(--sh);}

  /* ---------- MAP ---------- */
  .welcome{display:flex; gap:16px; align-items:center; flex-wrap:wrap;}
  .welcome .av{font-family:var(--emoji); font-size:2.6rem; width:74px; height:74px; display:grid; place-items:center; background:var(--gold); border:var(--b); border-radius:20px; box-shadow:var(--sh); flex-shrink:0;}
  .rankbar{height:16px; background:#fff; border:var(--b); border-radius:999px; overflow:hidden; margin-top:8px; max-width:420px;}
  .rankbar i{display:block; height:100%; background:repeating-linear-gradient(45deg,var(--gold),var(--gold) 10px,#FFD94D 10px,#FFD94D 20px); transition:width .6s;}
  .path{position:relative; margin-top:30px; display:grid; gap:16px;}
  .node{display:flex; align-items:center; gap:16px; background:#fff; border:var(--b); border-radius:var(--r); box-shadow:var(--sh); padding:14px 18px; text-align:left; width:min(100%,640px); cursor:pointer; transition:transform .12s;}
  .node:nth-child(even){margin-left:auto;}
  .node:hover:not(.locked){transform:translateY(-3px);}
  .node .ni{font-family:var(--emoji); font-size:2rem; width:60px; height:60px; border:var(--b); border-radius:50%; display:grid; place-items:center; background:var(--gold-wash); flex-shrink:0;}
  .node.done .ni{background:var(--gold);}
  .node.locked{cursor:not-allowed; opacity:.55; box-shadow:var(--sh-sm);}
  .node.locked .ni{background:#eee;}
  .node.current{outline:4px dashed var(--gold-deep); outline-offset:5px;}
  .node .nt{flex:1;}
  .node .nt b{font-family:var(--head); font-size:1.25rem; display:block; line-height:1.15;}
  .node .nt span{color:var(--muted); font-size:.95rem;}
  .node .ns{font-weight:800; font-size:.85rem; white-space:nowrap;}
  .node.final{background:var(--ink); color:#fff;}
  .node.final .nt span{color:#C4C7CE;}
  @media (max-width:560px){ .node{padding:12px; gap:12px;} .node .ni{width:50px; height:50px; font-size:1.6rem;} .node .ns{display:none;} }

  /* ---------- LEVEL SHELL ---------- */
  .lvl-head{display:flex; align-items:center; gap:14px; margin-bottom:20px; flex-wrap:wrap;}
  .lvl-head .t{flex:1; min-width:200px;}
  .steps{display:flex; gap:6px;}
  .steps i{width:28px; height:10px; border-radius:6px; border:2px solid var(--ink); background:#fff;}
  .steps i.on{background:var(--gold);}
  .steps i.done{background:var(--ink);}
  .intro-card{display:flex; gap:18px; align-items:flex-start;}
  .intro-card .big{font-family:var(--emoji); font-size:3.2rem; line-height:1;}
  .intro-card p+p{margin-top:10px;}
  .rule{background:var(--gold-wash); border:var(--b); border-radius:14px; padding:12px 16px; margin-bottom:18px;}
  .dots{display:flex; gap:6px; justify-content:center; margin:6px 0 16px; flex-wrap:wrap;}
  .dots i{width:12px; height:12px; border-radius:50%; border:2px solid var(--ink); background:#fff;}
  .dots i.done{background:var(--ink);} .dots i.now{background:var(--gold);}

  .big-card{max-width:520px; margin:0 auto; text-align:center; padding:28px 22px;}
  .big-emoji{font-family:var(--emoji); font-size:4.4rem; line-height:1.1;}
  .big-card h3{font-size:1.7rem; margin-top:6px;}
  .big-card p{margin-top:6px; color:var(--muted);}
  .choice-row{display:flex; gap:14px; justify-content:center; margin-top:20px; flex-wrap:wrap;}
  .choice-row .btn{min-width:170px;}

  .feedback{border:var(--b); border-radius:14px; padding:14px 16px; margin:18px auto 0; max-width:640px;}
  .feedback.good{background:var(--good-wash);}
  .feedback.bad{background:var(--bad-wash);}
  .feedback .btn{margin-top:12px;}

  /* ---------- DAY IN THE LIFE ---------- */
  .scene-top{display:flex; align-items:center; gap:14px;}
  .scene-top .time{font-family:var(--head); font-weight:800; font-size:1.1rem; background:var(--ink); color:var(--gold); padding:4px 12px; border-radius:10px;}
  .items{display:grid; grid-template-columns:repeat(2,1fr); gap:12px; margin-top:16px;}
  @media (max-width:640px){ .items{grid-template-columns:1fr;} }
  .item{display:flex; gap:12px; align-items:flex-start; text-align:left; background:#fff; border:var(--b); border-radius:14px; padding:12px 14px; cursor:pointer; box-shadow:var(--sh-sm); font-weight:700;}
  .item .ie{font-family:var(--emoji); font-size:1.7rem; line-height:1;}
  .item[aria-pressed="true"]{background:var(--gold-wash); box-shadow:var(--sh); outline:3px solid var(--gold-deep);}
  .item.r-good{background:var(--good-wash); outline:3px solid var(--good);}
  .item.r-bad{background:var(--bad-wash); outline:3px solid var(--bad);}
  .item.r-miss{background:#fff; outline:3px dashed var(--bad);}
  .item .how{display:block; font-weight:500; font-size:.92rem; color:var(--ink-2); margin-top:6px;}
  .item .how .dtag{margin-right:4px;}

  /* ---------- FLIP CARDS ---------- */
  .flips{display:grid; grid-template-columns:repeat(3,1fr); gap:14px;}
  @media (max-width:820px){ .flips{grid-template-columns:repeat(2,1fr);} }
  @media (max-width:500px){ .flips{grid-template-columns:1fr;} }
  .flip{display:block; width:100%; perspective:900px; background:none; border:0; padding:0; cursor:pointer; min-height:220px; text-align:left;}
  .flip .in{display:block; position:relative; width:100%; height:100%; min-height:220px; transition:transform .55s; transform-style:preserve-3d;}
  .flip.on .in{transform:rotateY(180deg);}
  .flip .f, .flip .bk{position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden; border:var(--b); border-radius:var(--r); box-shadow:var(--sh); padding:16px; display:flex; flex-direction:column;}
  .flip .f{background:#fff; align-items:center; justify-content:center; text-align:center; gap:6px;}
  .flip .f .fe{font-family:var(--emoji); font-size:3rem;}
  .flip .f b{font-family:var(--head); font-size:1.2rem; line-height:1.15;}
  .flip .f small{font-weight:800; color:var(--muted); font-size:.8rem;}
  .flip .bk{transform:rotateY(180deg); font-size:.93rem; gap:8px; overflow:auto;}
  .flip.data .bk{background:var(--data-wash);} .flip.cv .bk{background:var(--cv-wash);} .flip.nlp .bk{background:var(--nlp-wash);}
  .flip .bk b{font-weight:800;}

  /* ---------- RPS ---------- */
  .arena{display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:12px; text-align:center;}
  .arena .hand{font-family:var(--emoji); font-size:4.2rem; line-height:1.1; min-height:4.7rem;}
  .arena .who{font-weight:800; text-transform:uppercase; letter-spacing:.1em; font-size:.8rem;}
  .arena .sc{font-family:var(--head); font-size:2.2rem; font-weight:800;}
  .vs{font-family:var(--head); font-weight:800; font-size:1.4rem; background:var(--ink); color:var(--gold); width:52px; height:52px; display:grid; place-items:center; border-radius:50%;}
  .hands{display:flex; gap:12px; justify-content:center; margin-top:18px;}
  .hands .btn{font-family:var(--emoji); font-size:2.4rem; width:86px; height:86px; padding:0;}
  .verdict{font-family:var(--head); font-size:1.4rem; font-weight:800; text-align:center; margin-top:14px; min-height:1.8em;}
  .predict{text-align:center; margin-top:4px; color:var(--ink-2); min-height:1.6em;}
  .brain{background:var(--data-wash); border:var(--b); border-radius:var(--r); padding:16px; margin-top:20px;}
  .brain table{width:100%; border-collapse:collapse; margin-top:8px; font-weight:700;}
  .brain th, .brain td{border:2px solid var(--ink); padding:6px; text-align:center; background:#fff;}
  .brain th{background:var(--ink); color:#fff; font-size:.85rem;}
  .brain td.hot{background:var(--gold);}
  .brain .em{font-family:var(--emoji);}

  /* ---------- PIXELS ---------- */
  .pix-wrap{display:grid; grid-template-columns:1fr 1fr; gap:18px; align-items:start;}
  @media (max-width:700px){ .pix-wrap{grid-template-columns:1fr;} }
  .pgrid{display:grid; grid-template-columns:repeat(10,1fr); border:var(--b); border-radius:12px; overflow:hidden; touch-action:none; user-select:none; -webkit-user-select:none; background:#fff; aspect-ratio:1;}
  .pgrid div{border-right:1px solid rgba(0,0,0,.1); border-bottom:1px solid rgba(0,0,0,.1);}
  .ngrid{display:grid; grid-template-columns:repeat(10,1fr); border:var(--b); border-radius:12px; overflow:hidden; background:#fff; aspect-ratio:1; font-family:ui-monospace,Menlo,monospace; font-weight:700;}
  .ngrid div{display:grid; place-items:center; font-size:clamp(.55rem,1.6vw,.8rem); border-right:1px solid rgba(0,0,0,.08); border-bottom:1px solid rgba(0,0,0,.08);}
  .brushes{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px;}
  .brushes .btn{padding:8px 12px; font-size:.9rem; min-height:44px;}
  .swatch{display:inline-block; width:16px; height:16px; border:2px solid var(--ink); border-radius:4px;}
  .gtitle{font-weight:800; margin-bottom:8px;}

  .zoom{display:grid; grid-template-columns:auto 1fr; gap:22px; align-items:center;}
  @media (max-width:640px){ .zoom{grid-template-columns:1fr; justify-items:center;} }
  .zoom canvas{width:240px; height:240px; border:var(--b); border-radius:16px; box-shadow:var(--sh); image-rendering:pixelated; background:#fff;}
  .opts{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .opts .btn{width:100%;}
  .meter-res{font-weight:800; margin:8px 0 12px;}

  /* ---------- NLP ---------- */
  .tokens{display:flex; flex-wrap:wrap; gap:6px; margin-top:12px; min-height:36px;}
  .tok{padding:4px 10px; border-radius:10px; border:2px solid var(--ink); background:#f1f1f1; font-weight:800; font-size:.95rem;}
  .tok sup{font-size:.7rem; margin-left:3px;}
  .tok.pos{background:var(--good-wash); border-color:var(--good); color:#0B6B47;}
  .tok.neg{background:var(--bad-wash); border-color:var(--bad); color:#A3262B;}
  .tok.flip{text-decoration:line-through wavy;}
  .tok.negator{background:#EDE4FF; border-color:#6B46C1; color:#4C2E96;}
  .tok.boost{background:var(--gold-wash); border-color:var(--gold-deep);}
  .mood{display:flex; align-items:center; gap:14px; margin-top:16px;}
  .mood .face{font-family:var(--emoji); font-size:3rem; width:70px; text-align:center;}
  .mood .bar{flex:1; height:22px; border:var(--b); border-radius:999px; position:relative; background:linear-gradient(90deg,var(--bad-wash),#fff 50%,var(--good-wash));}
  .mood .bar i{position:absolute; top:-6px; width:8px; height:28px; background:var(--ink); border-radius:4px; transition:left .35s; transform:translateX(-50%);}
  .missions{display:grid; gap:8px; margin-top:14px;}
  .mission{display:flex; gap:10px; align-items:center; padding:10px 12px; border:2px solid var(--ink); border-radius:12px; background:#fff; font-weight:700;}
  .mission.now{background:var(--gold-wash); border-width:3px;}
  .mission.done{background:var(--good-wash); color:#0B6B47;}
  .mission.later{opacity:.5;}
  .legend{display:flex; gap:8px; flex-wrap:wrap; font-size:.85rem; margin-top:10px;}

  .sentence{font-family:var(--head); font-size:clamp(1.3rem,4vw,1.8rem); font-weight:700; min-height:2.6em; border:var(--b); border-radius:14px; background:#fff; padding:12px 16px;}
  .sentence .cursor{display:inline-block; width:3px; height:1.1em; background:var(--ink); vertical-align:-3px; margin-left:4px; animation:blink 1s steps(1) infinite;}
  @keyframes blink{50%{opacity:0;}}
  .suggest{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:14px;}
  @media (max-width:500px){ .suggest{grid-template-columns:1fr;} }
  .sg{display:flex; flex-direction:column; align-items:stretch; gap:6px; padding:12px; font-size:1.1rem;}
  .sg .pb{height:8px; background:#eee; border-radius:4px; overflow:hidden; border:1px solid var(--ink);}
  .sg .pb i{display:block; height:100%; background:var(--nlp);}
  .sg small{font-weight:700; color:var(--muted); font-size:.8rem;}

  /* ---------- SORTER ---------- */
  .sorter-top{display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; font-weight:800;}
  .timer{font-family:var(--head); font-size:1.5rem; background:var(--ink); color:var(--gold); padding:2px 14px; border-radius:12px;}
  .combo{color:var(--cv);}
  .bins{display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-top:18px;}
  .bin{border:var(--b); border-radius:var(--r); box-shadow:var(--sh); padding:14px 8px; cursor:pointer; text-align:center; font-weight:800; display:flex; flex-direction:column; align-items:center; gap:2px;}

<script>
(function(){
'use strict';

/* =====================================================================
   IDEAS, TRAPS (MISCONCEPTIONS) AND "WHY?" REASONS
   ===================================================================== */
// Every wrong answer in the question bank is tagged with one of these traps.
var MISC = {
  auto:{name:'"Automatic" means AI', c:'ai-spot',
    fix:'Automatic only means it runs by itself. A timer, sensor or switch follows a fixed rule. AI learns patterns from data and makes a prediction.'},
  robot:{name:'AI means robots', c:'ai-spot',
    fix:'Most AI has no body at all. It hides inside apps: maps, video feeds, keyboards, bank alerts.'},
  magic:{name:'AI is magic or reads minds', c:'ai-how',
    fix:'No magic: AI only knows what was in its data, and it predicts from patterns in that data.'},
  store:{name:'Data AI just stores data', c:'data-pat',
    fix:'Storing is what a pen drive does. Data AI finds patterns in the data and uses them to predict.'},
  moredata:{name:'More data always fixes everything', c:'data-bias',
    fix:'More of the same one-sided data just repeats the same mistake. Data must be correct and cover everyone, not just be big.'},
  right:{name:'AI is always right and fair', c:'data-bias',

  eyes:{name:'Computer Vision sees like our eyes', c:'cv-pix',

  gadget:{name:'Judging the domain by the gadget', c:'dom-sort',

};
// The "Why?" step in Mistake Review: pick the reason that really explains it.
var WHY = {
  auto:{right:'Being automatic is not enough. AI learns patterns from data; fixed rules never learn.', wrong:['Anything that works without a person is AI.','Anything with a chip or electricity is AI.']},
  robot:{right:'AI is software that learns from data. It usually hides inside apps, with no robot body.', wrong:['Real AI always has a robot body.','If you can\'t see a machine, there is no AI.']},
  magic:{right:'AI only knows what was in its data and predicts from patterns.', wrong:['AI can read people\'s minds.','AI just gets lucky.']},
  store:{right:'Data AI uses data to find patterns and make predictions.', wrong:['Saving data is the same as being smart.','Data AI is just a very big folder.']},
  moredata:{right:'Data must be correct and cover all kinds of cases. More one-sided data repeats the mistake.', wrong:['Any extra data fixes every problem.','The size of the data matters more than what is in it.']},

  eyes:{right:'The AI gets only pixel numbers, and lighting, angle or background can change them.', wrong:['AI sees and understands pictures just like our eyes.','With a good camera, AI can never be fooled.']},

  gadget:{right:'The domain depends on the input: records → Data, images → Vision, words/speech → NLP.', wrong:['Anything on a phone is the Data domain.','The domain depends on the brand of the device.']},
  onedomain:{right:'Real systems often combine domains, like speech (NLP) plus predictions (Data).', wrong:['Every AI app uses exactly one domain.','Mixing two domains is impossible.']}
};
var CONCEPTS = {
  'ai-spot':{name:'Spotting AI vs plain automation', lv:'l1', step:'day', hint:'AI learns from data and predicts. A timer, switch or sensor does the same fixed thing every time.'},

/* =====================================================================
   QUIZ ENGINE: mastery checks, Mistake Review and the boss all use it.
   - Every wrong option carries a trap tag (MISC).
   - A wrong answer queues a DIFFERENT question on the same idea to come
     back a couple of questions later (never the identical question).
   - Answering a returning idea right = "Mistake fixed!" + XP.
   ===================================================================== */
var BOSS_HITS = 8;
function hasTrap(q, m){ return q.o.some(function(o){ return !o.ok && o.m === m; }); }

function runQuiz(cfg){
  var st = {plan:cfg.plan.slice(), used:{}, log:[], redo:[], rc:{}, cur:null, hearts:3, hits:0, fixedNow:0, fixedList:[]};
  cfg.plan.forEach(function(q){ st.used[q.id] = true; });
  (cfg.seeds || []).forEach(function(m, i){
    var op = S.open[m] || {};
    st.redo.push({m:m, c:op.c || MISC[m].c, due:cfg.mode==='review' ? 0 : i+1, from:op.q});
    st.rc[m] = 1;
  });

  function variant(r){
    var lim = cfg.maxLv;
    function fine(q){ return !st.used[q.id] && q.id !== r.from && (lim === undefined || conceptLvIndex(q.c) <= lim); }
    var tiers = [
      function(q){ return q.c === r.c && hasTrap(q, r.m); },
      function(q){ return hasTrap(q, r.m); },
      function(q){ return q.c === r.c; }
    ];
    for(var t=0;t<tiers.length;t++){
      var c = ALLQ.filter(function(q){ return fine(q) && tiers[t](q); });
      if(c.length){
        var notRecent = c.filter(function(q){ return S.recent.indexOf(q.id) < 0; });
        var q = pick(notRecent.length ? notRecent : c);
        st.used[q.id] = true;
        return q;
      }
    }
    return null;
  }

  function next(){
    if(cfg.mode === 'boss' && (st.hits >= BOSS_HITS || st.hearts <= 0)) return cfg.onEnd(st);
    var q = null, r = null, k;
    while(!q){
      var di = -1;
      for(k=0;k<st.redo.length;k++){ if(st.redo[k].due <= st.log.length){ di = k; break; } }
      if(di < 0) break;
      r = st.redo.splice(di, 1)[0]; q = r.q || variant(r); if(!q) r = null;
    }
    while(!q && st.plan.length){ q = st.plan.shift(); }
    while(!q && st.redo.length){ r = st.redo.shift(); q = r.q || variant(r); if(!q) r = null; }
    if(!q && cfg.mode === 'boss'){
      var spare = ALLQ.filter(function(x){ return !st.used[x.id]; });
      if(spare.length){ q = pick(spare); st.used[q.id] = true; }
    }
    if(!q) return cfg.onEnd(st);
    st.cur = {q:q, r:r};
    render();
  }

  function header(){
    if(cfg.header) return cfg.header(st);
    var right = st.log.filter(function(x){ return x.ok; }).length;
    var left = st.plan.length + st.redo.length + 1;
    var pct = Math.round(st.log.length / (st.log.length + left) * 100);
    return '<div class="qhead"><span>'+(cfg.mode==='review' ? '🔧 Idea '+(st.log.length+1) : '🎯 Question '+(st.log.length+1))+'</span>'+
      '<span class="qbar" aria-hidden="true"><i style="width:'+pct+'%"></i></span>'+
      '<span>'+(cfg.mode==='review' ? '✅ Fixed: '+st.fixedNow : '✅ '+right+' / '+st.log.length)+'</span></div>';
  }

  function render(){
    var q = st.cur.q, r = st.cur.r;
    var order = q.o.map(function(o, i){ return i; });
    if(q.k === 'mcq') shuffle(order);
    var lead = r ? '<p class="center" style="margin-bottom:10px"><span class="tagq redo">🔁 Back again: an idea you missed, with a new example</span></p>' : '';
    var body;
    if(q.k === 'card'){
      body = '<p class="center" style="font-weight:800; margin-bottom:8px">Is this AI?</p>'+
        '<div class="card big-card pop"><div class="big-emoji" aria-hidden="true">'+q.e+'</div><h3 id="qtext" data-qid="'+q.id+'" tabindex="-1">'+q.q+'</h3><p>'+q.d+'</p></div>'+
        '<div class="choice-row">'+order.map(function(i){ return '<button class="btn big" type="button" data-oi="'+i+'">'+q.o[i].t+'</button>'; }).join('')+'</div>';
    } else if(q.k === 'bins'){
      body = '<div class="card big-card pop"><div class="big-emoji" aria-hidden="true">'+q.e+'</div><h3 id="qtext" data-qid="'+q.id+'" tabindex="-1" style="font-size:1.3rem">'+q.q+'</h3><p>Which AI domain does it mainly use?</p></div>'+
        '<div class="bins">'+order.map(function(i){ var d = q.o[i].d; return '<button type="button" class="bin '+d+'" data-oi="'+i+'"><span class="be" aria-hidden="true">'+DOM[d].icon+'</span><span class="lbl">'+DOM[d].short+'</span><small>'+DOM[d].verb+'</small></button>'; }).join('')+'</div>';
    } else {
      body = '<div class="card qcard pop">'+(q.e ? '<div class="big-emoji" aria-hidden="true" style="font-size:2.6rem">'+q.e+'</div>' : '')+
        '<div class="q" id="qtext" data-qid="'+q.id+'" tabindex="-1">'+q.q+'</div>'+
        '<div class="answers">'+order.map(function(i){ return '<button class="btn" type="button" data-oi="'+i+'">'+q.o[i].t+'</button>'; }).join('')+'</div></div>';
    }
    shell(cfg.lv, cfg.step, header() + lead + body + '<div id="fb" class="mt"></div>');
    $$('[data-oi]').forEach(function(b){ b.onclick = function(e){ answer(+b.getAttribute('data-oi'), e, b); }; });
    var qt = $('#qtext'); if(qt) qt.focus({preventScroll:true});
  }

  function answer(i, e, btn){
    var q = st.cur.q, r = st.cur.r, o = q.o[i], ok = !!o.ok;
    $$('[data-oi]').forEach(function(b){ b.disabled = true; if(q.o[+b.getAttribute('data-oi')].ok) b.classList.add('right'); });
    if(!ok) btn.classList.add('wrong');
    remember(q.id); save();
    if(ok && r && cfg.mode === 'review') return whyStep(q, r, o, e);
    settle(ok, o, e, '');
  }

  function whyStep(q, r, o, e){
    var W = WHY[r.m];
    var reasons = shuffle([{t:W.right, ok:true}, {t:W.wrong[0]}, {t:W.wrong[1]}]);
    beep('good');
    $('#fb').innerHTML = '<div class="feedback good pop"><b>✅ Right answer!</b> '+o.w+
      '<p class="mt"><b>🤔 Now the "Why?" step:</b> which reason explains it best?</p>'+
      '<div class="reasons">'+reasons.map(function(x, k){ return '<button class="btn" type="button" data-why="'+k+'">'+x.t+'</button>'; }).join('')+'</div></div>';
    announce('Right answer! Now the Why step: which reason explains it best?');
    $('[data-why]').focus();
    $$('[data-why]').forEach(function(b){
      b.onclick = function(ev){
        var x = reasons[+b.getAttribute('data-why')];
        $$('[data-why]').forEach(function(y){ y.disabled = true; if(reasons[+y.getAttribute('data-why')].ok) y.classList.add('right'); });
        if(!x.ok) b.classList.add('wrong');
        if(x.ok) settle(true, o, ev, '<p>🧠 <b>Reason:</b> '+W.right+'</p>');
        else settle(false, {m:r.m, w:'Good answer, but the reason matters too. The real reason: <b>'+W.right+'</b>'}, ev, '', true);
      };
    });
  }

  function settle(ok, o, e, extra, whyMiss){
    var q = st.cur.q, r = st.cur.r, boss = cfg.mode === 'boss';
    st.log.push({id:q.id, c:q.c, ok:ok, m:ok ? null : o.m, redo:!!r});
    var right = q.o.filter(function(x){ return x.ok; })[0];
    var html, requeued = false;
    if(ok){
      var fixedMsg = '';
      if(r && S.open[r.m]){
        var xp = cfg.mode === 'review' ? 20 : 15;
        delete S.open[r.m]; S.fixed++; S.fixedLog.push(r.m); st.fixedNow++; st.fixedList.push(r.m); save();
        addXP(xp, e); beep('fix');
        fixedMsg = '<div class="fixed">Mistake fixed! ✅ You beat the trap "'+MISC[r.m].name.replace(/"/g,'')+'". +'+xp+' XP</div>';
      } else {
        addXP(10, e); beep(boss ? 'hit' : 'good');
        if(r) fixedMsg = '<div class="fixed">Idea locked in! ✅</div>';
      }
      if(boss){ st.hits++; var bot = $('#bot'); if(bot){ bot.classList.add('hit'); } var hp = $('.hp i'); if(hp) hp.style.width = Math.max(0, 100 - st.hits/BOSS_HITS*100)+'%'; var hpn = $('#hpn'); if(hpn) hpn.textContent = (BOSS_HITS-st.hits)*10+' HP'; }
      html = '<b>'+(boss ? '💥 Direct hit!' : '✅ Correct!')+'</b> '+o.w+(extra||'')+fixedMsg;
    } else {
      openMiss(o.m, q.c, q.id);
      if((st.rc[o.m] || 0) < 2){
        // Reserve the follow-up question now, so the promise below is always kept.
        var vq = variant({m:o.m, c:q.c, from:q.id});
        if(vq){
          st.rc[o.m] = (st.rc[o.m] || 0) + 1;
          st.redo.push({m:o.m, c:q.c, due:st.log.length + (cfg.mode==='review' ? 0 : boss ? 1 : 2), from:q.id, q:vq});
          requeued = true;
        }
      }
      if(boss){ st.hearts--; var hs = $('.hearts'); if(hs){ hs.textContent = '❤️'.repeat(Math.max(0,st.hearts))+'🤍'.repeat(3-Math.max(0,st.hearts)); hs.setAttribute('aria-label', st.hearts+' hearts left'); } }
      beep('bad');
      var card = $('.big-card') || $('.qcard'); if(card){ card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake'); }
      html = '<b>'+(boss ? '💔 Ouch!' : '❌ Not quite.')+'</b><br><span class="trap">⚠️ Trap: '+MISC[o.m].name+'</span>'+
        '<p>'+o.w+'</p>'+
        (whyMiss ? '' : '<p class="ans">✔ Answer: <b>'+right.t+'</b>'+(right.w ? ' — '+right.w : '')+'</p>')+
        (requeued ? '<p class="redo-note">🔁 This idea will come back soon, with a different example.</p>'
                  : '<p class="redo-note saved-note">📌 Saved to your mistake list. You\'ll get to fix it in a later review.</p>');
    }
    var more = st.plan.length || st.redo.length;
    var label = boss ? (st.hits >= BOSS_HITS ? 'Finish GLITCH →' : st.hearts <= 0 ? 'See what happened' : 'Next attack →')
                     : (more ? 'Next →' : (cfg.mode==='review' ? 'Finish review →' : 'See my score →'));
    $('#fb').innerHTML = '<div class="feedback '+(ok?'good':'bad')+' pop">'+html+'<br><button class="btn primary" id="nx" type="button">'+label+'</button></div>';
    announce(html);
    var nx = $('#nx'); nx.focus({preventScroll:true});
    if(nx.scrollIntoView) nx.scrollIntoView({block:'nearest', behavior: reduceMotion ? 'auto' : 'smooth'});
    nx.onclick = function(){ beep('click'); next(); window.scrollTo(0, 0); };
  }

  next();
  return st;
}

/* ---------- Mastery check for a level ---------- */
function buildPlan(lv){
  var last = R(lv.id).last || [], plan = [];
  lv.picks.forEach(function(p){
    var cand = ALLQ.filter(function(q){ return p[0](q) && plan.indexOf(q) < 0; });
    var a = shuffle(cand.filter(function(q){ return last.indexOf(q.id) < 0 && S.recent.indexOf(q.id) < 0; }));
    var b = shuffle(cand.filter(function(q){ return last.indexOf(q.id) < 0 && S.recent.indexOf(q.id) >= 0; }));
    var c = shuffle(cand.filter(function(q){ return last.indexOf(q.id) >= 0; }));
    plan = plan.concat(a.concat(b, c).slice(0, p[1]));
  });
  return shuffle(plan);
}
function runCheck(lv, skipIntro){
  if(!skipIntro){
    shell(lv, 'check',
      '<div class="card intro-card pop"><div class="big" aria-hidden="true">🎯</div><div>'+
        '<h3>Mastery check</h3>'+
        '<p><b>6 questions</b>, plus a "second chance" question on any idea you miss. Score <b>80% or more</b> to pass and unlock the next level.</p>'+
        '<p>'+starsHtml(1,'')+' 80% · '+starsHtml(2,'')+' 90% · '+starsHtml(3,'')+' 100%</p>'+
        '<p class="muted-sm">Not there yet? You\'ll see what to revisit and get <b>new</b> questions next time.</p>'+
        '<button class="btn primary big mt" id="go" type="button">Start the check →</button>'+
      '</div></div>');
    $('#go').onclick = function(){ beep('click'); runCheck(lv, true); };
    return;
  }
  var rec = R(lv.id); rec.tries++; save();
  var seeds = Object.keys(S.open).filter(function(m){ return lv.concepts.indexOf(S.open[m].c) >= 0; }).slice(0, 2);
  runQuiz({lv:lv, step:'check', mode:'check', plan:buildPlan(lv), seeds:seeds, maxLv:LEVELS.indexOf(lv),
    onEnd:function(st){ checkResult(lv, st); }});
}
function checkResult(lv, st){
  var total = st.log.length, right = st.log.filter(function(x){ return x.ok; }).length;
  var ratio = total ? right/total : 0, pct = Math.round(ratio*100), stars = starsFor(ratio);
  R(lv.id).last = st.log.map(function(x){ return x.id; }); save();
  if(stars > 0){ complete(lv, {pct:pct, stars:stars, right:right, total:total, fixed:st.fixedNow}); return; }
  var cs = [], ms = [];
  st.log.forEach(function(x){ if(!x.ok){ if(cs.indexOf(x.c) < 0) cs.push(x.c); if(x.m && ms.indexOf(x.m) < 0) ms.push(x.m); } });
  beep('bad');
  shell(lv, 'check',
    '<div class="card pop center"><div class="big-emoji" aria-hidden="true">💪</div><h2>So close: '+right+' / '+total+' ('+pct+'%)</h2>'+
      '<p class="mt">You need <b>80%</b> to unlock the next level. Mistakes are how learning works. AI learns from its errors too!</p>'+
      (st.fixedNow ? '<p class="mt">You already fixed <b>'+st.fixedNow+'</b> mistake'+(st.fixedNow>1?'s':'')+' this round. 💪</p>' : '')+
    '</div>'+
    '<div class="card mt2"><h3>🔧 Ideas to revisit</h3><ul class="revisit">'+cs.map(function(c){
        var C = CONCEPTS[c], same = C.lv === lv.id;
        return '<li><b>'+C.name+'</b><span>'+C.hint+'</span>'+(same ? '<br><button class="btn mt" type="button" data-rev="'+C.step+'">🔧 Revisit this part</button>' : '')+'</li>';
      }).join('')+'</ul>'+
      (ms.length ? '<h3 class="mt2">⚠️ Traps you fell into</h3><ul class="revisit">'+ms.map(function(m){ return '<li><b>'+MISC[m].name+'</b><span>'+MISC[m].fix+'</span></li>'; }).join('')+'</ul>' : '')+
    '</div>'+
    '<div class="center mt2"><button class="btn primary big" id="retry" type="button">🔁 Retry with new questions</button></div>');
  $$('[data-rev]').forEach(function(b){ b.onclick = function(){ beep('click'); lv.run(lv, b.getAttribute('data-rev')); window.scrollTo(0,0); }; });
  $('#retry').onclick = function(){ beep('click'); runCheck(lv, true); window.scrollTo(0,0); };
}

function complete(lv, res){
  var rec = R(lv.id), first = !rec.passed, prev = rec.stars;
  rec.passed = true; rec.best = Math.max(rec.best, res.pct); rec.stars = Math.max(rec.stars, res.stars);
  S.at = null; save();
  var bonus = first ? 30 + 10*res.stars : Math.max(0, res.stars - prev) * 10;
  if(bonus) addXP(bonus);
  hud(); beep('win'); confetti();
  var idx = LEVELS.indexOf(lv), nxt = LEVELS[idx+1];
  var go = (lv.id === 'l4' && !S.ckpt) ? 'checkpoint' : nxt ? nxt.id : 'finale';
  var label = (lv.id === 'l4' && !S.ckpt) ? 'Session 1 done → ' : nxt ? 'Next: '+nxt.title+' →' : '🎓 Design your AI & get your certificate →';
  modal(
    '<div class="badge-big" aria-hidden="true">'+lv.badge.icon+'</div>'+
    '<span class="kicker">Level '+(idx+1)+' passed</span>'+
    '<h2>'+(first ? 'Badge unlocked: ' : '')+lv.badge.name+'</h2>'+
    '<p style="font-size:1.6rem">'+starsHtml(res.stars, 'You earned ')+'</p>'+
    '<p>Score <b>'+res.right+' / '+res.total+' ('+res.pct+'%)</b>'+(res.fixed ? ' · <b>'+res.fixed+'</b> mistake'+(res.fixed>1?'s':'')+' fixed ✅' : '')+'</p>'+
    (res.stars < 3 ? '<p class="muted-sm">Replay any time for more stars. You\'ll get different questions.</p>' : '')+
    (lv.domain ? '<p>'+tag(lv.domain)+' power card unlocked on your map!</p>' : '')+
    '<div class="takeaway">🧠 <b>Remember:</b> '+lv.takeaway+'</div>'+
    (bonus ? '<p><b>+'+bonus+' XP</b> '+(first ? 'level bonus' : 'for new stars')+'</p>' : '')+
    '<div class="row"><button class="btn primary" data-go="'+go+'" type="button">'+label+'</button><button class="btn" data-go="map" type="button">Map</button></div>',
    'Level passed');
}

/* ---------- Mistake Review (before the boss, and for returning players) ---------- */
var REVIEW_LV = {id:'review', icon:'🔧', title:'Mistake Review', kicker:'Quick review · ~2–3 min', steps:['review']};
function runReview(lv, step, then, ctx){
  var ms = Object.keys(S.open);

  shell(lv, step,
    '<div class="card intro-card pop"><div class="big" aria-hidden="true">🔧</div><div>'+
      '<h3>'+(ctx === 'boss' ? 'Before the boss: Mistake Review' : 'Fix your open ideas')+'</h3>'+

    '</div></div>');

          '<button class="btn primary big mt" id="cont" type="button">'+(ctx === 'boss' ? '⚔️ On to the boss!' : 'Continue →')+'</button>'+
        '</div>');
      $('#cont').onclick = function(){ beep('click'); then(); window.scrollTo(0,0); };
    }});
  };
}

   ===================================================================== */
function route(where, step){
  closeModal();
  lastShell = '';
  if(where === 'map'){ S.at = null; save(); renderMap(); }
  else if(where === 'intro') renderIntro();
  else if(where === 'finale') renderFinale();
  else if(where === 'checkpoint') renderCheckpoint();
  else if(where === 'review') runReview(REVIEW_LV, 'review', function(){ route('map'); });
  else { var lv = levelById(where); if(lv && unlocked(LEVELS.indexOf(lv))) lv.run(lv, step); else renderMap(); }
  window.scrollTo(0,0);
  if(where === 'map' || where === 'intro' || where === 'finale' || where === 'checkpoint'){ var h = $('#stage h1, #stage h2'); if(h){ h.setAttribute('tabindex','-1'); h.focus({preventScroll:true}); } }
}

/* =====================================================================
   QUESTION BANK
   Every wrong option has a trap tag (m) and its own explanation (w) that
   speaks to that exact misconception. 4–9 variants per idea, so retries,
   second chances and reviews always find a question the child hasn't seen.
   ===================================================================== */
var ALLQ = [];
// "Is this AI?" card. Wrong "Not AI" on a real AI = the "AI means robots / AI is visible" trap.
function AIC(id, e, title, desc, isAI, wRight, wWrong, trap){
  var m = trap || (isAI ? 'robot' : 'auto');
  ALLQ.push({id:id, c:'ai-spot', k:'card', e:e, q:title, d:desc, isAI:isAI, o:[
    {t:'🤖 It\'s AI', ok:isAI, m:isAI ? null : m, w:isAI ? wRight : wWrong},
    {t:'⚙️ Not AI', ok:!isAI, m:isAI ? m : null, w:isAI ? wWrong : wRight}
  ]});
}
function MCQ(id, c, e, q, right, wrongs){
  ALLQ.push({id:id, c:c, k:'mcq', e:e, q:q, o:[{t:right[0], ok:true, w:right[1]}].concat(wrongs.map(function(w){ return {t:w[0], m:w[1], w:w[2]}; }))});
}
var INPUT = {data:'records and numbers', cv:'pictures or video', nlp:'words or speech'};
function BIN(id, e, text, d, why){
  ALLQ.push({id:id, c:'dom-sort', k:'bins', e:e, q:text, o:['data','cv','nlp'].map(function(x){
    return x === d ? {d:x, t:DOM[x].short, ok:true, w:why}
      : {d:x, t:DOM[x].short, m:'gadget', w:'What goes IN here is <b>'+INPUT[d]+'</b>, so it\'s '+DOM[d].name+'.'+(x==='data' ? ' Every AI uses data, so ask what KIND of data.' : '')};
  })});
}

function flipGrid(d, cards){
  return '<div class="flips">'+cards.map(function(c, i){
    return '<button type="button" class="flip '+d+'" data-flip="'+i+'" aria-label="'+esc(c.t)+': tap to flip">'+
      '<span class="in"><span class="f"><span class="fe" aria-hidden="true">'+c.e+'</span><b>'+c.t+'</b><small>TAP TO FLIP</small></span>'+
      '<span class="bk"><span><b>📥 Learns from:</b> '+c.from+'</span><span><b>🎯 It can:</b> '+c.does+'</span>'+(c.where?'<span><b>🌍 Seen in:</b> '+c.where+'</span>':'')+'</span></span></button>';
  }).join('')+'</div>';
}
function bindFlips(onAll){
  var seen = {};
  $$('[data-flip]').forEach(function(b){
    b.onclick = function(e){
      b.classList.toggle('on'); beep('click');
      var k = b.getAttribute('data-flip');
      b.setAttribute('aria-label', b.classList.contains('on') ? plain($('.bk', b).innerHTML) : plain($('.f b', b).innerHTML)+': tap to flip');
      if(!seen[k]){ seen[k] = true; addXP(5, e); if(Object.keys(seen).length === $$('[data-flip]').length) onAll(); }
    };
  });
}
function cardsStep(lv, d, cards, rule, finLabel){
  shell(lv, 'cards',
    '<div class="rule">🌍 <b>'+rule+'</b> Flip every card. Then take the mastery check.</div>'+
    flipGrid(d, cards)+
    '<div class="center mt2"><button class="btn primary big" id="fin" type="button" disabled>Flip all '+cards.length+' cards to continue</button></div>');
  bindFlips(function(){ var f = $('#fin'); f.disabled = false; f.textContent = finLabel; });
  $('#fin').onclick = function(){ beep('click'); runCheck(lv); window.scrollTo(0,0); };
}

function runL1(lv, step){

  function how(){

        '<div id="lab" hidden>'+
          '<p class="mt" id="predfb"></p>'+
          '<div class="twin mt">'+
            '<div class="machine rule"><h4>⚙️ Calculator</h4><p class="muted-sm">Question: 25 × 4</p><ol id="oc"></ol><button class="btn" id="askC" type="button">Ask again</button></div>'+
            '<div class="machine learn"><h4>🤖 Maps travel time</h4><p class="muted-sm">Question: Home → School at 8 am</p><ol id="om"></ol><button class="btn" id="askM" type="button">Ask again</button></div>'+
          '</div>'+
        '</div>'+
        '<div id="def" hidden></div>'+
      '</div>');
    $$('[data-p]').forEach(function(b){
      b.onclick = function(){
        pred = b.getAttribute('data-p');
        $$('[data-p]').forEach(function(x){ x.classList.toggle('sel', x === b); x.disabled = true; });
        beep('click');
        $('#lab').hidden = false;
        $('#predfb').innerHTML = 'You predicted: <b>'+b.textContent+'</b>. Test it! Ask each machine 3 times.';
        $('#askC').focus();
      };
    });
    function check(){
      if(nc < 3 || nm < 3 || !$('#def').hidden) return;
      var good = pred === 'maps';
      addXP(15);
      $('#def').hidden = false;
      $('#def').innerHTML = '<div class="feedback '+(good?'good':'bad')+' pop"><b>'+(good ? '✅ Your prediction was right!' : '🤔 Surprise! Only Maps changed.')+'</b>'+
        '<ul class="explain"><li>⚙️ <span><b>Fixed rule:</b> same input → same output, every time. Calculator, timer, sensor door. Automatic, but <b>not AI</b>.</span></li>'+
        '<li>🤖 <span><b>AI:</b> learns <b>patterns from data</b> and makes a <b>prediction</b> when it can\'t be 100% sure. New data → new answer. And it can be <b>wrong</b>!</span></li></ul>'+
        '<p class="mt"><b>Your test:</b> "Does it learn from data and predict?" Not "Is it automatic?" and not "Does it look like a robot?"</p>'+
        '<button class="btn primary mt" id="nx" type="button">Next: find the AI in Riya\'s day →</button></div>';
      announce($('#def').innerHTML);
      $('#nx').focus();
      $('#nx').onclick = function(){ beep('click'); day(); window.scrollTo(0,0); };

  }

    picks.forEach(function(k){ SCENES[k].items.forEach(function(it){ if(it.d) total++; }); });
    function scene(){

      shell(lv, 'day',

    '<div class="card no-print">'+

      '<div class="fin-step"><span class="gtitle" id="q2" style="display:block">2. Which superpowers (domains) does it need?</span><p class="hint">Pick one or more. What goes IN? Records → Data, pictures → Vision, words/speech → NLP.</p>'+
        '<div class="toggles" role="group" aria-labelledby="q2" style="justify-content:flex-start; margin-top:0">'+['data','cv','nlp'].map(function(d){ return '<button type="button" class="btn '+d+'" aria-pressed="'+(idea.d.indexOf(d) >= 0)+'" data-dd="'+d+'">'+DOM[d].icon+' '+DOM[d].short+'</button>'; }).join('')+'</div>'+
      '</div>'+
      '<div class="fin-step"><span class="gtitle" id="q3" style="display:block">3. What data would it learn from?</span><p class="hint">Remember: AI is only as good as its data.</p>'+chips(DATA_OPTS, idea.data, 'da')+

      '<div class="fin-step"><span class="gtitle" id="q5" style="display:block">5. How would a human check it?</span>'+chips(CHECK_OPTS, idea.chk, 'ck')+
        '<label class="sr-only" for="cx">Other check</label><input class="input mt" id="cx" maxlength="100" placeholder="Your own idea (optional)" value="'+esc(idea.chkX)+'"></div>'+
      '<div class="fin-step"><label class="gtitle" for="an" style="display:block">6. Give your AI a cool name</label>'+
        '<input class="input" id="an" maxlength="30" placeholder="e.g. AquaBuddy" value="'+esc(idea.n === 'My AI' ? '' : idea.n)+'"></div>'+
      '<button class="btn primary big mt2" id="mk" type="button" style="width:100%">✨ Create my AI idea card</button>'+
      '<p class="muted-sm mt center">🔒 Nothing you type leaves this browser.</p>'+
    '</div>'+
    '<div id="out"></div>';
  function toggleMulti(attr, arr){
    $$('[data-'+attr+']').forEach(function(b){ b.onclick = function(){ var k = +b.getAttribute('data-'+attr), i = arr.indexOf(k); if(i >= 0) arr.splice(i,1); else arr.push(k); b.setAttribute('aria-pressed', i < 0); beep('click'); }; });
  }
  toggleMulti('da', idea.data); toggleMulti('ri', idea.risk); toggleMulti('ck', idea.chk);
  $$('[data-dd]').forEach(function(b){ b.onclick = function(){ var d = b.getAttribute('data-dd'), i = idea.d.indexOf(d); if(i >= 0) idea.d.splice(i,1); else idea.d.push(d); b.setAttribute('aria-pressed', i < 0); beep('click'); }; });
  $$('[data-pp]').forEach(function(b){ b.onclick = function(){
    var k = +b.getAttribute('data-pp'); idea.pi = k; beep('click');
    $$('[data-pp]').forEach(function(x){ x.setAttribute('aria-pressed', x === b); });
    $('#otherWrap').hidden = k !== -1;
    if(k === -1){ $('#pb').focus(); return; }
    idea.p = PROBLEMS[k].t; idea.d = PROBLEMS[k].d.slice();
    $$('[data-dd]').forEach(function(x){ x.setAttribute('aria-pressed', idea.d.indexOf(x.getAttribute('data-dd')) >= 0); });
    toast('💡 Suggested domains selected. Change them if you disagree!', 2600);
  }; });
  $('#mk').onclick = function(e){
    var sel = $('[data-pp][aria-pressed="true"]');
    if(sel && sel.getAttribute('data-pp') === '-1') idea.p = $('#pb').value.trim();
    idea.dataX = $('#dx').value.trim(); idea.riskX = $('#rx').value.trim(); idea.chkX = $('#cx').value.trim();
    idea.n = $('#an').value.trim() || 'My AI';
    if(!sel || !idea.p){ toast('Step 1: pick or describe a problem first!'); (sel ? $('#pb') : $('[data-pp]')).focus(); return; }
    if(!idea.d.length){ toast('Step 2: pick at least one domain!'); $('[data-dd]').focus(); return; }
    if(!idea.data.length && !idea.dataX){ toast('Step 3: every AI needs data. Pick at least one!'); $('[data-da]').focus(); return; }
    if(!idea.risk.length && !idea.riskX){ toast('Step 4: think about what could go wrong. Pick at least one.'); $('[data-ri]').focus(); return; }
    if(!idea.chk.length && !idea.chkX){ toast('Step 5: how would a human check it? Pick at least one.'); $('[data-ck]').focus(); return; }
    var firstTime = !S.idea;
    S.idea = cleanIdea(idea); save();
    if(firstTime) addXP(50, e);
    beep('win'); confetti();
    showOut(true);
  };
  if(S.idea) showOut(false);
  function tips(id){
    var t = [];
    if(id.d.indexOf('cv') >= 0 && id.data.indexOf(0) < 0) t.push('Vision learns from <b>photos or video</b>. Add them to its data?');
    if(id.d.indexOf('nlp') >= 0 && id.data.indexOf(1) < 0 && id.data.indexOf(2) < 0) t.push('NLP learns from <b>text or voice</b>. Add them to its data?');
    if(id.d.indexOf('data') >= 0 && id.data.indexOf(3) < 0 && id.data.indexOf(4) < 0) t.push('Data AI predicts from <b>past records</b>. Add them to its data?');
    if(id.risk.indexOf(2) >= 0 && id.chk.indexOf(2) < 0) t.push('You spotted possible unfairness. Testing on <b>many different kinds of people</b> would help.');
    return t;
  }
  function showOut(scroll){
    var id = cleanIdea(S.idea), L = ideaLists(id), date = new Date().toLocaleDateString('en-IN', {day:'numeric', month:'long', year:'numeric'});
    var tp = tips(id), totalStars = LEVELS.reduce(function(a, l){ return a + (S.lv[l.id] ? S.lv[l.id].stars : 0); }, 0);
    function ul(a){ return '<ul style="margin-left:18px">'+a.map(function(x){ return '<li>'+esc(x)+'</li>'; }).join('')+'</ul>'; }
    $('#out').innerHTML =
      '<div class="idea mt2 pop" id="ideaCard"><span class="kicker">My AI idea</span><h3>🤖 '+esc(id.n)+'</h3>'+
        '<dl><dt>Problem</dt><dd>'+esc(id.p)+'</dd><dt>Superpowers</dt><dd>'+id.d.map(tag).join(' ')+'</dd>'+
        '<dt>Learns from</dt><dd>'+ul(L.data)+'</dd><dt>Could go wrong</dt><dd>'+ul(L.risk)+'</dd><dt>Human check</dt><dd>'+ul(L.chk)+'</dd>'+
        '<dt>Inventor</dt><dd>'+S.avatar+' '+esc(S.name)+'</dd></dl></div>'+
      (tp.length ? '<div class="takeaway no-print">💡 <b>Designer tips:</b><ul style="margin:6px 0 0 18px">'+tp.map(function(t){ return '<li>'+t+'</li>'; }).join('')+'</ul></div>' : '')+
      '<div class="row mt no-print" style="justify-content:center"><button class="btn primary big" id="dl" type="button">⬇️ Download my AI idea card (PNG)</button></div>'+
      '<div class="cert mt2">'+
        '<div class="seal" aria-hidden="true">🏆</div><span class="kicker">AI Kids Lab</span>'+
        '<h2>Certificate of AI Reflection</h2>'+
        '<p class="mt">This certifies that</p><div class="nm">'+esc(S.name)+'</div>'+
        '<p>has completed the <b>AI Reflection Quest</b>: telling AI from automation and mastering the three domains of AI, with <b>'+totalStars+' of '+(LEVELS.length*3)+' stars</b>.</p>'+
        '<table class="lvtable"><thead><tr><th>Level</th><th>Stars</th></tr></thead><tbody>'+LEVELS.map(function(l){ var r = S.lv[l.id]; return '<tr><td>'+l.badge.icon+' '+l.title+'</td><td>'+starsHtml(r ? r.stars : 0, l.title+': ')+'</td></tr>'; }).join('')+'</tbody></table>'+
        '<p class="mt"><b>'+S.fixed+'</b> mistake'+(S.fixed===1?'':'s')+' fixed ✅ · <b>'+S.xp+' XP</b> · rank <b>'+rankOf(S.xp).name+'</b></p>'+
        '<div class="recap">'+
          '<div class="data"><b>🔢 Data</b>Finds <strong>patterns</strong> in records to <strong>predict</strong>. Only as good as its data.</div>'+
          '<div class="cv"><b>👁️ Computer Vision</b>Turns pictures into <strong>numbers</strong>, then edges, shapes and labels.</div>'+
          '<div class="nlp"><b>💬 NLP</b>Splits words into <strong>tokens</strong> and matches patterns. Sarcasm and slang are hard.</div>'+
        '</div>'+
        '<p class="muted mt">Inventor of <b>'+esc(id.n)+'</b> · '+date+'</p>'+
      '</div>'+
      '<div class="row mt2 no-print" style="justify-content:center"><button class="btn primary big" id="pr" type="button">🖨️ Print / save certificate</button><button class="btn big" id="edit" type="button">✏️ Edit my idea</button></div>'+
      '<div class="card mt2 no-print"><h3>🪞 Reflect</h3><p class="muted">Talk about these with a friend or write them in your notebook:</p><ol style="margin:10px 0 0 20px; display:grid; gap:6px"><li>Which AI did you use <b>today</b>? Which domain was it, and what data did it learn from?</li><li>Who could <b>'+esc(id.n)+'</b> treat unfairly, and how would you find out?</li><li>Name one machine you used to think was AI but is really a <b>fixed rule</b>.</li></ol></div>'+
      '<div class="cta mt2 no-print"><h3>For schools and parents</h3><p>This free lesson is one small piece of the AI Kids Lab programme for Grades 7–9: hands-on, gamified and built around the CBSE AI curriculum.</p>'+
        '<div class="row"><a class="btn primary" href="index.html">Explore AI Kids Lab →</a><a class="btn" href="'+WA_URL+'" target="_blank" rel="noopener">💬 WhatsApp us about your school</a><button class="btn" data-nav="map" type="button">🗺️ Back to map</button></div></div>';
    $('#pr').onclick = function(){ window.print(); };
    $('#dl').onclick = function(){ beep('click'); downloadIdea(id, L); };
    $('#edit').onclick = function(){ $('#stage .card').scrollIntoView({behavior: reduceMotion ? 'auto' : 'smooth', block:'start'}); var f = $('[data-pp]'); if(f) f.focus({preventScroll:true}); };

/* ---- "My AI Idea" card as a PNG, drawn on a canvas in the browser ---- */
function downloadIdea(id, L){
  var W = 1080, H = 1350, c = document.createElement('canvas'); c.width = W; c.height = H;
  var x = c.getContext('2d');
  var HEAD = '"Baloo 2", "Trebuchet MS", sans-serif', BODY = 'Nunito, system-ui, sans-serif', EMO = getComputedStyle(document.body).getPropertyValue('--emoji');
  var M = 90, maxW = W - 2*M, FOOT = H - 200;
  function roundRect(rx, ry, rw, rh, r){ x.beginPath(); x.moveTo(rx+r, ry); x.arcTo(rx+rw, ry, rx+rw, ry+rh, r); x.arcTo(rx+rw, ry+rh, rx, ry+rh, r); x.arcTo(rx, ry+rh, rx, ry, r); x.arcTo(rx, ry, rx+rw, ry, r); x.closePath(); }
  // Wrap text into lines; continuation lines are indented by `indent` px. Returns the y of the last line.
  function wrap(text, px, py, mw, lh, maxLines, indent){
    indent = indent || 0;
    var words = String(text).split(/\s+/), line = '', lines = [];
    words.forEach(function(w){ var t = line ? line+' '+w : w; var lim = lines.length ? mw - indent : mw; if(x.measureText(t).width > lim && line){ lines.push(line); line = w; } else line = t; });
    if(line) lines.push(line);
    if(lines.length > maxLines){ lines = lines.slice(0, maxLines); lines[maxLines-1] = lines[maxLines-1].replace(/\s*\S*$/, '')+'…'; }
    lines.forEach(function(l, i){ x.fillText(l, px + (i ? indent : 0), py + i*lh); });
    return py + (lines.length-1)*lh;
  }
  function draw(k){
    var f = function(n){ return Math.round(n*k); };
    x.clearRect(0, 0, W, H);
    x.fillStyle = '#15171C'; x.fillRect(0, 0, W, H);
    x.fillStyle = 'rgba(255,255,255,0.05)';
    for(var gx=20; gx<W; gx+=36) for(var gy=20; gy<H; gy+=36){ x.beginPath(); x.arc(gx, gy, 2, 0, 6.3); x.fill(); }
    x.strokeStyle = '#FFC800'; x.lineWidth = 10; x.strokeRect(36, 36, W-72, H-72);
    x.textBaseline = 'alphabetic';
    var y = 120;
    x.fillStyle = '#FFC800'; x.font = '800 28px '+BODY; x.fillText('MY AI IDEA · AI REFLECTION QUEST', M, y);
    y += f(86); x.fillStyle = '#FFFFFF'; x.font = '800 '+f(76)+'px '+HEAD;
    y = wrap('🤖 '+id.n, M, y, maxW, f(80), 2);
    function label(t){ y += f(64); x.fillStyle = '#FFC800'; x.font = '800 '+f(26)+'px '+BODY; x.fillText(t.toUpperCase(), M, y); y += f(46); x.fillStyle = '#FFFFFF'; x.font = '700 '+f(34)+'px '+BODY; }
    label('The problem'); y = wrap(id.p, M, y, maxW, f(44), 3);
    label('Superpowers');
    var px = M, COL = {data:'#2F6FED', cv:'#E8453C', nlp:'#109A66'};
    id.d.forEach(function(d){
      var t = DOM[d].short; x.font = '800 '+f(30)+'px '+BODY; var w = x.measureText(t).width + 48;
      x.fillStyle = COL[d]; roundRect(px, y-f(36), w, f(50), f(25)); x.fill();
      x.fillStyle = '#FFFFFF'; x.fillText(t, px+24, y); px += w + 16;
    });
    x.font = '700 '+f(34)+'px '+BODY;
    var bullet = x.measureText('• ').width;
    function list(arr, max){
      arr.slice(0, max).forEach(function(t, i){ if(i) y += f(46); y = wrap('• '+t, M, y, maxW, f(42), 2, bullet); });
      if(arr.length > max){ y += f(46); x.fillText('• +'+(arr.length-max)+' more', M, y); }
    }
    label('Learns from'); list(L.data, 3);
    label('What could go wrong'); list(L.risk, 3);
    label('How a human checks it'); list(L.chk, 3);
    x.fillStyle = 'rgba(255,200,0,.35)'; x.fillRect(M, H - 160, maxW, 3);
    x.fillStyle = '#C4C7CE'; x.font = '700 30px '+BODY;
    x.fillText('Inventor: '+S.name, M, H - 110);
    x.font = '34px '+EMO; x.fillText(S.avatar, W - M - 44, H - 108);
    x.fillStyle = '#FFC800'; x.font = '800 26px '+BODY; x.fillText('AI Kids Lab · aikidslab.co', M, H - 70);
    return y;
  }
  function save(){
    // shrink the text until everything fits above the footer
    for(var k = 1; k >= 0.6; k -= 0.05){ if(draw(k) <= FOOT) break; }
    var name = 'my-ai-idea-'+(id.n.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'') || 'card')+'.png';
    function go(href, revoke){
      var a = document.createElement('a'); a.href = href; a.download = name; document.body.appendChild(a); a.click(); a.remove();
      if(revoke) setTimeout(function(){ URL.revokeObjectURL(href); }, 4000);
      toast('⬇️ Saved '+esc(name)+'. Check your downloads!');
    }
    try{
      if(c.toBlob) c.toBlob(function(b){ if(b) go(URL.createObjectURL(b), true); else go(c.toDataURL('image/png')); }, 'image/png');
      else go(c.toDataURL('image/png'));
    }catch(e){ toast('Sorry, this browser could not create the image. Try Print instead.'); }
  }
  var fontsReady = document.fonts && document.fonts.load ? Promise.all([document.fonts.load('800 76px "Baloo 2"'), document.fonts.load('700 34px Nunito'), document.fonts.load('800 26px Nunito')]) : null;
  if(fontsReady){ var done = false; var t = setTimeout(function(){ if(!done){ done = true; save(); } }, 1500); fontsReady.then(function(){ if(!done){ done = true; clearTimeout(t); save(); } }, function(){ if(!done){ done = true; clearTimeout(t); save(); } }); }
  else save();
}

hud();

  lastShell = '';
  var lv = S.at ? levelById(S.at.lv) : null;
  if(lv && unlocked(LEVELS.indexOf(lv))){ lv.run(lv, S.at.step); window.scrollTo(0,0); }

if(!S.name) route('intro');
else {

  try{ firstLoad = !sessionStorage.getItem('aikl-rq-session'); sessionStorage.setItem('aikl-rq-session', '1'); }catch(e){}
  if(firstLoad && openCount()) renderWelcomeBack(resume);
  else resume();
}
if(MIGRATED) toast('🆕 The quest got an upgrade: 6 levels with mastery checks. Your name and XP are saved; levels start fresh.', 7000);
})();
